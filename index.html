* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 30%, #222228, var(--desk) 70%);
  color: #e6e9ef;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }

.console {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(8px, env(safe-area-inset-left, 0px));
}

/* ---------- Body ---------- */
.shell {
  position: relative;
  width: min(100%, 520px);
  height: 100%;
  border-radius: 56px;
  background:
    linear-gradient(160deg,
      color-mix(in srgb, var(--shell-hi) var(--sa), transparent) 0%,
      color-mix(in srgb, var(--shell) var(--sa), transparent) 32%,
      color-mix(in srgb, var(--shell) var(--sa), transparent) 70%,
      color-mix(in srgb, var(--shell-lo) var(--sa), transparent) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.5),
    inset 2px 0 0 rgba(255,255,255,0.22),
    inset -3px 0 4px rgba(0,0,0,0.12),
    inset 0 -5px 8px rgba(0,0,0,0.18),
    0 2px 0 var(--shell-lo),
    0 28px 50px rgba(0,0,0,0.55),
    0 8px 14px rgba(0,0,0,0.35);
  display: flex; flex-direction: column; align-items: center;
  padding: 0 20px 24px;
  isolation: isolate;
  overflow: hidden;
}
.land .shell {
  width: 100%;
  border-radius: 48px;
  flex-direction: row; align-items: stretch;
  padding: 16px;
  gap: 14px;
}
.grain { position: absolute; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%; }
.sheen { position: absolute; inset: 0; z-index: 0; pointer-events: none; border-radius: inherit; overflow: hidden; }
.sheen .blob {
  position: absolute; width: 150%; height: 110%; left: -40%; top: -45%;
  background: radial-gradient(closest-side, rgba(255,255,255,0.2), rgba(255,255,255,0.06) 45%, rgba(255,255,255,0) 72%);
  will-change: transform;
}
.sheen::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 1px 2px 3px rgba(255,255,255,0.35); }
.topbar, .center, .controls, .sticker { position: relative; z-index: 1; }

/* Power light in the top-right corner */
.topbar { width: 100%; height: 46px; flex: none; }
.land .topbar { position: absolute; inset: 0 0 auto 0; height: 0; }
.led { position: absolute; right: 34px; top: 20px; width: 8px; height: 8px; border-radius: 50%; background: #10260f; box-shadow: inset 0 1px 1px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.35); transition: background 0.3s, box-shadow 0.3s; }
.led-r { display: none; position: relative; right: auto; top: auto; margin-left: 6px; }
.land .topbar .led { display: none; }
.land .led-r { display: block; }
.land .half.right .row { justify-content: space-between; }
.console.on .led { background: #3dff4a; box-shadow: 0 0 6px #3dff4a, 0 0 14px rgba(61,255,74,0.5); }
.console.on .led.danger { background: #ff3b30; box-shadow: 0 0 6px #ff3b30, 0 0 14px rgba(255,59,48,0.55); animation: ledpulse 0.4s ease-in-out infinite alternate; }
@keyframes ledpulse { to { opacity: 0.35; } }

/* ---------- Screen ---------- */
.center { display: flex; flex-direction: column; align-items: center; flex: none; margin-bottom: 22px; }
.land .center { order: 2; justify-content: center; margin-bottom: 0; }
.bezel {
  position: relative;
  padding: 7px;
  border-radius: 30px;
  background: linear-gradient(170deg, var(--bezel-hi), var(--bezel) 45%);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 1px 0 2px rgba(255,255,255,0.35), inset 0 1px 2px rgba(255,255,255,0.12);
}
.screen {
  position: relative; width: var(--scr); height: var(--scr);
  border-radius: 23px;
  touch-action: none;
}
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.brand { height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--print); opacity: 0.85; }
.land .brand { height: 30px; }
.brand b { font: italic 700 15px/1 var(--font-print); letter-spacing: 0.06em; }
.brand span { font: 600 8px/1 var(--font-print); letter-spacing: 0.14em; padding: 2px 5px; border: 1px solid currentColor; border-radius: 3px; }

.lcd-fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.07) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 3px),
    radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,0.45) 100%);
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.7), inset 0 0 2px rgba(0,0,0,0.9);
}
.lcd-off { position: absolute; inset: 0; z-index: 8; border-radius: 23px; background: #050607; display: grid; place-items: center; transition: opacity 0.6s ease; }
.lcd-off span { font: 400 9px/1 var(--font-lcd); color: #23262b; letter-spacing: 0.08em; }
.console.on .lcd-off { opacity: 0; pointer-events: none; }
.glass { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 9; }
.glass .band {
  position: absolute; inset: -60%;
  background: linear-gradient(118deg,
    transparent 38%, rgba(255,255,255,0.06) 44%, rgba(255,255,255,0.02) 49%, transparent 53%,
    transparent 58%, rgba(255,255,255,0.03) 60%, transparent 63%);
  will-change: transform;
}
.glass canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.4; }
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(90% 60% at 22% -5%, rgba(255,255,255,0.045), transparent 60%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 1px 0 0 rgba(255,255,255,0.06);
}
.no-refl .blob, .no-refl .band, .no-refl .spec { display: none; }

/* In-screen UI (LCD) */
.lcd { position: absolute; z-index: 4; font: 400 10px/1.25 var(--font-lcd); color: #e6e9ef; text-shadow: 0 0 6px rgba(230,236,255,0.35), 0 1px 0 #000; letter-spacing: 0.02em; }
.lcd-hud { left: 0; right: 0; top: 0; border-radius: 23px 23px 0 0; padding: 9px 12px 12px; display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; font-size: clamp(7px, calc(var(--scr) * 0.028), 10px); background: linear-gradient(rgba(0,0,0,0.6), transparent); pointer-events: none; }
.lcd-hud .lv { color: var(--sodium); text-shadow: 0 0 6px rgba(255,176,86,0.5), 0 1px 0 #000; }
.lcd-hud .r { display: flex; gap: 0.8em; align-items: center; }
.lcd-hud .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8d97a8; vertical-align: 0; }
.pips { display: flex; gap: 4px; align-items: center; }
.lcd-hud .hl { display: flex; align-items: center; gap: 7px; }
.jump-ico { display: inline-block; width: 9px; height: 12px; background: currentColor; color: rgba(255,255,255,0.22);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 12'><path d='M1 1h7M1.5 3.5l6-1M1.5 6l6-1M1.5 8.5l6-1M1 11h7' stroke='black' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 12'><path d='M1 1h7M1.5 3.5l6-1M1.5 6l6-1M1.5 8.5l6-1M1 11h7' stroke='black' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") center / contain no-repeat; }
.jump-ico.ready { color: #7dff9a; filter: drop-shadow(0 0 4px #7dff9a); }
.jump-ico.charge { color: #ffa21a; }
.boost-ico { display: inline-block; width: 10px; height: 12px; background: currentColor; color: rgba(255,255,255,0.22);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12'><path d='M1.5 6l3.5-3.5L8.5 6M1.5 10.5L5 7l3.5 3.5' stroke='black' stroke-width='1.7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12'><path d='M1.5 6l3.5-3.5L8.5 6M1.5 10.5L5 7l3.5 3.5' stroke='black' stroke-width='1.7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat; }
.boost-ico.ready { color: #6ef0ff; filter: drop-shadow(0 0 4px #6ef0ff); }
.boost-ico.used { color: rgba(110,240,255,0.3); }
.pips i { width: 7px; height: 7px; border-radius: 2px; background: rgba(255,255,255,0.16); }
.pips i.on { background: #7dff9a; box-shadow: 0 0 6px #7dff9a; }
.lcd-hud .dot.live { background: #7dff9a; box-shadow: 0 0 6px #7dff9a; }
.lcd-hud .dot.warn { background: #ffa21a; }
.lcd-prompt { left: 50%; bottom: 10px; transform: translateX(-50%); padding: 4px 8px; background: rgba(0,0,0,0.72); border: 1px solid rgba(255,176,86,0.6); color: var(--sodium); white-space: nowrap; animation: blink 1s steps(2, start) infinite; pointer-events: none; }
.lcd-toast { left: 12px; right: 12px; bottom: 38px; padding: 6px 8px; text-align: center; background: rgba(6,8,14,0.85); border: 1px solid rgba(255,176,86,0.35); transition: opacity 0.35s; pointer-events: none; text-wrap: balance; }
@keyframes blink { 50% { opacity: 0.25; } }
.lcd-panel { inset: 0; z-index: 6; border-radius: 23px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; background: rgba(4,6,12,0.9); }
.lcd-panel h2 { margin: 0; font: 700 clamp(15px, calc(var(--scr) * 0.065), 22px)/1.05 var(--font-lcd); color: #fff; }
.lcd-panel .sub { color: var(--sodium); text-shadow: 0 0 8px rgba(255,176,86,0.55), 0 1px 0 #000; }
.lcd-panel p { margin: 0; color: #aab3c2; }
.lcd-panel .warn { color: #ffa21a; }
.lcd-panel .cta { text-shadow: 0 0 8px rgba(255,176,86,0.55), 0 1px 0 #000; color: var(--sodium); animation: blink 1s steps(2, start) infinite; margin-top: 4px; }
.lcd-panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; width: 100%; max-width: 240px; max-height: calc(var(--scr) - 76px); overflow-y: auto; scrollbar-width: none; }
.lcd-panel ul::-webkit-scrollbar { display: none; }
.lcd-panel li { padding: 4px 6px; text-align: left; color: #aab3c2; cursor: pointer; }
.lcd-panel li.sel { color: #111; background: var(--sodium); text-shadow: none; box-shadow: 0 0 12px rgba(255,176,86,0.45); }
.lcd-panel li.sel::before { content: "> "; }
.lib ul { flex-direction: column; gap: 7px; max-width: calc(var(--scr) * 0.82); max-height: calc(var(--scr) - 40px); }
.lib li { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 7px 26px 7px 8px; border: 1px solid rgba(255,176,86,0.25); border-radius: 4px; text-align: left; }
.lib li.sel { color: #fff; background: rgba(255,176,86,0.1); border-color: var(--sodium); box-shadow: 0 0 14px rgba(255,176,86,0.45); text-shadow: 0 0 6px rgba(255,176,86,0.5), 0 1px 0 #000; }
.lib li.sel::before { content: none; }
.lib .cart { flex: none; width: 34px; height: 34px; border-radius: 4px; background: linear-gradient(180deg, #0b1430 0 62%, #2a313c 62% 68%, #161b22 68%); position: relative; overflow: hidden; }
.lib .cart::before { content: ""; position: absolute; left: 18%; top: 22%; width: 38%; height: 38%; border-radius: 50%; background: radial-gradient(circle, rgba(255,176,86,0.55), transparent 70%); }
.lib li { position: relative; }
.lib .clr { position: absolute; right: 8px; top: calc(50% - 6px); width: 12px; height: 12px; background: #ffd23f; clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); filter: drop-shadow(0 0 4px rgba(255,210,63,0.8)); }
.lib .tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lib .tx small { font-size: 8px; opacity: 0.7; }
.lib li.sel .tx small { opacity: 0.85; }
.lib .cart.l2 { background: linear-gradient(180deg, #1a2330 0 30%, #c9d6e2 30% 62%, #5d6878 62% 66%, #2a3442 66%); }
.lib .cart.l2::before { left: 14%; top: 34%; width: 72%; height: 4%; border-radius: 2px; background: #3ee6ff; box-shadow: 0 0 8px #3ee6ff; }
.lib .cart.l3 { background: radial-gradient(ellipse 60% 30% at 50% 30%, rgba(255,140,50,0.45), transparent 70%), linear-gradient(180deg, #1a0d09 0 62%, #ffb04a 62% 65%, #e0521c 65% 74%, #5a1608 74%); }
.lib .cart.l3::before { left: 64%; top: 8%; width: 14%; height: 50%; border-radius: 1px; background: #2a1712; box-shadow: -14px 6px 0 -1px #2a1712; }
.lib .cart::after { content: ""; position: absolute; left: 42%; top: 47%; width: 16%; height: 16%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a7c, #d32a33 55%, #4a0710); }
.stats { display: flex; gap: 6px; }
.stats div { padding: 5px 8px; border: 1px solid rgba(255,176,86,0.35); }
.stats b { display: block; font: 700 14px/1.1 var(--font-lcd); color: #fff; }
.stats span { font-size: 8px; color: #8d97a8; }
#bootPanel { background: #0a0c12; overflow: hidden; }
.boot-logo { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translateY(-260%); }
.boot-logo img { width: calc(var(--scr) * 0.68); height: auto; display: block; filter: drop-shadow(0 0 18px rgba(245,200,67,0.3)); }
.boot-logo .spark { position: absolute; width: 14px; height: 14px; background: #ffd23f; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 4px rgba(255,210,63,0.8)); animation: twinkle 0.9s ease-in-out infinite alternate; }
.boot-logo .s1 { left: 2px; top: 22%; }
.boot-logo .s2 { right: 8px; top: 8%; width: 10px; height: 10px; background: #7de3ff; animation-delay: 0.3s; }
.boot-logo .s3 { right: -2px; bottom: 26%; animation-delay: 0.6s; }
.boot-logo .s4 { left: 12px; bottom: 12%; width: 9px; height: 9px; background: #ff9ccc; animation-delay: 0.45s; }
@keyframes twinkle { from { transform: scale(0.5) rotate(0deg); opacity: 0.4; } to { transform: scale(1.15) rotate(45deg); opacity: 1; } }
.boot-logo.drop { animation: drop 1.3s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes drop { to { transform: translateY(0); } }
.boot-legal { position: absolute; bottom: 14px; font: 400 9px/1 "DotGothic16", var(--font-lcd); letter-spacing: 0.08em; color: #5b6272; }

/* ---------- Control panel (recessed) ---------- */
.controls {
  width: 100%; flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  border-radius: 30px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) var(--sa), transparent), color-mix(in srgb, var(--panel) var(--sa), transparent));
  box-shadow: inset 0 3px 7px rgba(0,0,0,0.2), inset 0 1px 2px rgba(0,0,0,0.18), 0 1px 0 rgba(255,255,255,0.45);
  padding: 18px 18px 22px;
}
.half { display: flex; flex-direction: column; min-width: 0; }
.half .row { display: flex; align-items: center; height: 30px; }
.half.left .row { justify-content: flex-start; }
.half.right .row { justify-content: flex-end; }
.half .mid { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.half .foot { display: flex; padding-top: 4px; }
.half.left .foot { justify-content: flex-end; padding-right: 14px; }
.half.right .foot { justify-content: flex-start; padding-left: 14px; }
.land .controls { display: contents; }
.land .half {
  position: relative; flex: 1; order: 1;
  border-radius: 30px; padding: 16px 16px 18px;
  background: color-mix(in srgb, var(--panel) var(--sa), transparent);
  box-shadow: inset 0 3px 7px rgba(0,0,0,0.2), inset 0 1px 2px rgba(0,0,0,0.18), 0 1px 0 rgba(255,255,255,0.45);
}
.land .half.right { order: 3; }
.land .half .foot { justify-content: center; padding: 0; }

/* Speaker grilles */
.speaker { display: flex; gap: 6px; padding: 0 4px; }
.speaker i { width: 4px; height: 16px; border-radius: 3px; background: rgba(0,0,0,0.55); box-shadow: inset 0 2px 2px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.4); }

/* Power slider, centred at the top of the panel */
.power { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 2; }
/* OFF/ON are printed inside the track, each in the half the knob leaves open. */
.pw-lbl { position: absolute; inset: 0; pointer-events: none; font: 500 7.5px/1 var(--font-print); letter-spacing: 0.12em; color: rgba(236,238,244,0.7); }
.pw-lbl i { position: absolute; top: 0; bottom: 0; width: 26px; display: flex; align-items: center; justify-content: center; font-style: normal; opacity: 0; transition: opacity 0.2s;
  transform: translateY(1px); /* the capitals ride high in Chakra Petch's line box */ }
.pw-lbl .pw-on { left: 1px; }
.pw-lbl .pw-off { right: 1px; }
.console:not(.on) .pw-lbl .pw-off, .console.on .pw-lbl .pw-on { opacity: 1; }
.land .power { left: auto; right: 16px; transform: none; top: 20px; }
.power .slot { position: relative; width: 58px; height: 22px; border-radius: 11px; background: color-mix(in srgb, var(--pill) 60%, #000); box-shadow: inset 0 2px 4px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.45); }
.power .knob { position: absolute; top: 2px; left: 2px; width: 30px; height: 18px; border-radius: 9px; background: linear-gradient(var(--shell-hi), var(--shell-lo)); box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.6); transition: transform 0.25s cubic-bezier(.3,1.5,.6,1); }
.console.on .power .knob { transform: translateX(24px); }

/* D-pad */
.dpad { --dp: clamp(96px, calc((min(100vw - 16px, 520px) - 84px) / 2), 138px); position: relative; flex: none; width: var(--dp); height: var(--dp); }
.land .dpad { --dp: min(128px, 30vh); }
.dpad-well { position: absolute; inset: 2%; border-radius: 50%; background: radial-gradient(circle at 50% 45%, rgba(0,0,0,0.14), rgba(0,0,0,0.04) 62%, rgba(255,255,255,0.16) 72%, transparent 74%); }
.cross { position: absolute; inset: 10%; transition: transform 0.06s; filter: drop-shadow(0 4px 0 var(--dpad-lo)) drop-shadow(0 7px 7px rgba(0,0,0,0.4)); }
.dpad[data-dir="left"] .cross { transform: perspective(240px) rotateY(-11deg) translateY(1px); filter: drop-shadow(0 2px 0 var(--dpad-lo)) drop-shadow(0 4px 4px rgba(0,0,0,0.4)); }
.dpad[data-dir="right"] .cross { transform: perspective(240px) rotateY(11deg) translateY(1px); filter: drop-shadow(0 2px 0 var(--dpad-lo)) drop-shadow(0 4px 4px rgba(0,0,0,0.4)); }
.dpad[data-dir="up"] .cross { transform: perspective(240px) rotateX(11deg) translateY(1px); }
.dpad[data-dir="down"] .cross { transform: perspective(240px) rotateX(-11deg) translateY(1px); }
.cross i { position: absolute; border-radius: 6px; background: linear-gradient(150deg, var(--dpad-hi), var(--dpad) 38%, var(--dpad) 70%, var(--dpad-lo)); }
.cross .h { left: 0; right: 0; top: 34%; height: 32%; }
.cross .v { top: 0; bottom: 0; left: 34%; width: 32%; }
.cross .c { left: 39%; top: 39%; width: 22%; height: 22%; border-radius: 50%; background: radial-gradient(circle at 50% 60%, rgba(255,255,255,0.12), rgba(0,0,0,0.35)); }
.cross .arw { position: absolute; width: 0; height: 0; border: 5px solid transparent; opacity: 0.5; }
.cross .au { left: calc(50% - 5px); top: 7%; border-bottom-color: rgba(0,0,0,0.5); border-top: 0; }
.cross .ad { left: calc(50% - 5px); bottom: 7%; border-top-color: rgba(0,0,0,0.5); border-bottom: 0; }
.cross .al { top: calc(50% - 5px); left: 7%; border-right-color: rgba(0,0,0,0.5); border-left: 0; }
.cross .ar { top: calc(50% - 5px); right: 7%; border-left-color: rgba(0,0,0,0.5); border-right: 0; }
.dz { position: absolute; z-index: 2; }
.dz.l { left: 0; top: 25%; width: 42%; height: 50%; }
.dz.r { right: 0; top: 25%; width: 42%; height: 50%; }
.dz.u { top: 0; left: 25%; width: 50%; height: 40%; }
.dz.d { bottom: 0; left: 25%; width: 50%; height: 40%; }

/* Four face buttons in a diamond */
.face { --fc: clamp(96px, calc((min(100vw - 16px, 520px) - 80px) / 2), 144px); position: relative; flex: none; width: var(--fc); height: var(--fc); --bt: calc(var(--fc) * 0.34); }
.land .face { --fc: min(132px, 31vh); }
.btn {
  position: absolute; width: var(--bt); height: var(--bt); border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, var(--btn-hi) 0%, var(--btn) 40%, var(--btn) 64%, var(--btn-lo) 100%);
  box-shadow: 0 4px 0 var(--btn-lo), 0 7px 9px rgba(0,0,0,0.38), inset 0 -2px 3px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.35), 0 0 0 4px rgba(0,0,0,0.06);
  transition: transform 0.05s, box-shadow 0.05s;
  display: grid; place-items: center;
  font: 700 13px/1 var(--font-print); color: var(--btn-ink);
}
.btn .spec { position: absolute; width: 34%; height: 22%; left: 22%; top: 14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.75), rgba(255,255,255,0)); transform: rotate(-30deg); will-change: transform; pointer-events: none; }
.btn.down, .pill.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-lo), 0 2px 3px rgba(0,0,0,0.38), inset 0 -1px 2px rgba(0,0,0,0.3); }
#btnX { left: calc(50% - var(--bt) / 2); top: 0; }
#btnB { left: calc(50% - var(--bt) / 2); bottom: 0; }
#btnY { left: 0; top: calc(50% - var(--bt) / 2); }
#btnA { right: 0; top: calc(50% - var(--bt) / 2); }

/* Start / Select */
.pill-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pill { width: 54px; height: 16px; border-radius: 8px; background: linear-gradient(180deg, var(--pill-hi), var(--pill) 50%, var(--pill-lo)); box-shadow: 0 2px 0 var(--pill-lo), 0 3px 5px rgba(0,0,0,0.35), 0 0 0 4px rgba(0,0,0,0.05); }
.pill-wrap small { font: 700 8.5px/1 var(--font-print); letter-spacing: 0.14em; color: var(--print); opacity: 0.85; }

/* ---------- Stickers (long-press to lift, drag to move) ---------- */
.sticker {
  position: absolute; z-index: 3;
  left: calc(var(--x, 50) * 1%); top: calc(var(--y, 50) * 1%);
  transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35));
  touch-action: none; cursor: grab;
  transition: transform 0.15s, filter 0.15s;
}
.sticker.lift { z-index: 6; cursor: grabbing; transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1.18); filter: drop-shadow(0 10px 10px rgba(0,0,0,0.35)); }
.sticker svg, .sticker img { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; -webkit-user-drag: none; }
.st-piko { width: 66px; height: 66px; }
.st-bolt { width: 22px; height: 30px; }
.st-star { width: 24px; height: 24px; }
.st-rocket { width: 46px; height: 46px; }
.st-mush { width: 50px; height: 48px; }
.st-mush:not(.lift) { filter: none; } /* the artwork already has its own border and shading */
.st-cat { width: 32px; height: 54px; }

@media (prefers-reduced-motion: reduce) {
  .boot-logo.drop { animation-duration: 0.3s; }
  .lcd-prompt, .lcd-panel .cta { animation: none; }
}
</style>
</head>

          <div class="lcd lcd-panel" id="donePanel" hidden>

              <div><b id="doneBreaks">0</b><span>BREAKS</span></div>
              <div hidden><b id="doneTop">0.0</b><span>TOP</span></div>
            </div>
            <span class="cta">PRESS A</span>
          </div>

          <div class="lcd-fx"></div>
          <div class="lcd-off" id="lcdOff"></div>
        </div>
        <div class="glass"><canvas id="glassWear"></canvas><i class="band" id="glassBand"></i></div>

    </div>

      </div>
      <div class="half right">

    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) c = !c;

        const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);

        g.fillStyle = "#150b08";
        g.beginPath(); g.moveTo(x, base); g.lineTo(x + w * 0.12, base - th * 0.55); g.lineTo(x + w * 0.3, base - th);
        g.lineTo(x + w * 0.7, base - th); g.lineTo(x + w * 0.88, base - th * 0.55); g.lineTo(x + w, base); g.closePath(); g.fill();
        g.strokeStyle = "#150b08"; g.lineWidth = 6;
        g.beginPath(); g.moveTo(x + w * 0.5, base - th); g.lineTo(x + w * 0.5, base - th - 30 * k); g.lineTo(x + w * 1.3, base - th - 30 * k); g.lineTo(x + w * 1.3, base - th * 0.3); g.stroke();
        const hx = x + w * 0.5, hy = base - th * 0.12;

        gl.addColorStop(0, "rgba(255,170,70,0.75)"); gl.addColorStop(0.3, "rgba(255,90,30,0.3)"); gl.addColorStop(1, "rgba(255,60,20,0)");
        g.fillStyle = gl; g.fillRect(hx - 46 * k, hy - 46 * k, 92 * k, 92 * k);
        g.fillStyle = "#ffcf80"; g.fillRect(hx - 5, hy - 4, 10, 8);
        x += w * 1.5 + R1() * 40;
      } else if (kind < 0.7) {
        // Smoke stacks with a dull lip glow.
        const n = 1 + Math.floor(R1() * 3);

          const sw = 12 + R1() * 8, sh = (230 + R1() * 120) * k;

          g.fillStyle = "rgba(255,110,40,0.25)"; g.fillRect(x, h - sh, sw, 3);

        g.fillStyle = "#130a08"; g.fillRect(x, h - bh, w, bh);

    for (let tx = 0; tx < TILE; tx += 48) { g.moveTo(tx, h * 0.06 + 8); g.lineTo(tx + 24, h * 0.2); g.lineTo(tx + 48, h * 0.06 + 8); }
    g.stroke();

    for (let cx = 90; cx < TILE; cx += 340) {

      g.beginPath(); g.moveTo(cx, h * 0.2 + 30); g.lineTo(cx - 40, h * 0.2 + 5); g.moveTo(cx + 16, h * 0.2 + 30); g.lineTo(cx + 56, h * 0.2 + 5); g.stroke();
    }

    for (let cx = 200; cx < TILE; cx += 170 + R2() * 160) {

      g.lineWidth = 2; g.setLineDash([5, 3]);

      g.setLineDash([]);

      if (R2() < 0.35) {

        g.lineWidth = 3; g.beginPath(); g.moveTo(cx - 26, y + 8); g.lineTo(cx, y); g.lineTo(cx + 26, y + 8); g.stroke();

  // ===================== Input =====================
  let sensorLive = false, lastSensorAt = 0, denied = false;

  let padDir = 0;
  const keys = new Set();

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
    return typeof window.orientation === "number" ? window.orientation : 0;
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;

  }
  function setStatus(k) {
    const d = $("statusDot"), t = $("statusText");
    d.className = "dot";
    if (k === "live") { d.classList.add("live"); t.textContent = "GYRO"; }
    else if (k === "waiting") t.textContent = "...";
    else { d.classList.add("warn"); t.textContent = "D-PAD"; }
  }
  // Slope input, as sin(θ) of the tilt the ball feels.
  function input() {
    const k = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
    if (padDir || k) return (padDir || k) * 0.65;

  }

  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} }

  // ===================== Lifts, dock and the Use button =====================
  const liftMoving = (l) => Math.abs(l.y - l.target) > 1e-4;
  const atBottom = (l) => Math.abs(l.y - l.yBottom) < 1e-3;
  const atTop = (l) => Math.abs(l.y - l.yTop) < 1e-3;

  function useContext() {
    if (!ball.alive || !ball.grounded || fitT >= 0) return null;

      if (liftMoving(l)) continue;
      if (ball.on === l) return atBottom(l) ? { label: "GO UP", run: () => { l.target = l.yTop; } } : { label: "GO DOWN", run: () => { l.target = l.yBottom; } };
      for (const c of l.calls) {
        const y = c.at === "top" ? l.yTop : l.yBottom, here = c.at === "top" ? atTop(l) : atBottom(l);
        if (!here && ball.x > c.x0 && ball.x < c.x1 && Math.abs(ball.y - (y - R)) < 0.2) return { label: "CALL LIFT", run: () => { l.target = y; } };
      }
    }
    if (dock && !dockDone() && Math.abs(ball.x - dock.x) < 0.75 && Math.abs(ball.y - (dock.y - R)) < 0.2) return { label: "FIT MODULE", run: startFit };

  // The dock fits the spring (Level 2) or the thruster (Level 3).
  const dockDone = () => !!dock && (dock.gives === "double" ? hasDouble : hasJump);

  function useAction() {

  }
  function requestJump() { if (hasJump && fitT < 0) jumpBuf = JUMP_BUFFER; }
  function startFit() {
    fitT = 0;
    ball.vx = ball.vy = 0; ball.omega = 0;
    sfxFit();
  }

  // ===================== Moving parts =====================
  function crusherBottom(c, t) {
    const p = mod(t + c.phase, c.period), upT = c.period - 2.0;
    if (p < upT) return c.up;
    if (p < upT + 0.25) { const k = (p - upT) / 0.25; return lerp(c.up, c.down, k * k); }
    if (p < upT + 0.8) return c.down;
    return lerp(c.down, c.up, (p - upT - 0.8) / 1.2);
  }
  const crusherWarn = (c, t) => { const p = mod(t + c.phase, c.period), upT = c.period - 2.0; return p > upT - 0.55 && p < upT + 0.25; };
  const zapOn = (z, t) => mod(t, z.period) < z.onFor;
  const zapWarn = (z, t) => mod(t, z.period) > z.period - 0.45;
  const laserOn = (l, t) => l.always || mod(t + (l.phase || 0), l.period) < l.onFor;
  const laserWarn = (l, t) => !l.always && !laserOn(l, t) && mod(t + (l.phase || 0), l.period) > l.period - 0.4;
  const ventOn = (v, t) => mod(t + (v.phase || 0), v.period) < v.onFor;
  const ventWarn = (v, t) => !ventOn(v, t) && mod(t + (v.phase || 0), v.period) > v.period - 0.6;

  function dynamicRects() {
    const out = [];
    for (const l of lifts) {
      out.push({ r: [l.x0, l.y, l.x1, l.y + 0.3], obj: l });
      for (const gt of l.gates) if (!(gt.openAt === "top" ? atTop(l) : atBottom(l))) out.push({ r: gt.r, obj: "gate" });
    }
    for (const d of doors) out.push({ r: [d.x0, d.top, d.x1, d.bottom], obj: d });
    for (const c of crushers) out.push({ r: [c.x0, c.top, c.x1, c.bottom], obj: c });
    for (const m of movers) out.push({ r: [m.x, m.y, m.x + m.w, m.y + 0.3], obj: m });
    return out;
  }

  function circleRectOverlap(cx, cy, r, [x0, y0, x1, y1]) {
    const qx = clamp(cx, x0, x1), qy = clamp(cy, y0, y1);
    return r - Math.hypot(cx - qx, cy - qy);
  }

  // ===================== Physics step =====================
  function collideSeg(ax, ay, bx, by, obj) {
    const ex = bx - ax, ey = by - ay;
    const t = clamp(((ball.x - ax) * ex + (ball.y - ay) * ey) / (ex * ex + ey * ey), 0, 1);
    const qx = ax + ex * t, qy = ay + ey * t;
    const dx = ball.x - qx, dy = ball.y - qy;
    const d = Math.hypot(dx, dy);
    if (d >= R || d < 1e-7) return;
    const nx = dx / d, ny = dy / d;
    ball.x += nx * (R - d); ball.y += ny * (R - d);
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) {
      if (-vn > BREAK_V) { breakBall("impact"); return; }
      const e = -vn > 2.5 ? BOUNCE_E : 0;
      ball.vx -= nx * vn * (1 + e); ball.vy -= ny * vn * (1 + e);

    }

  }
  function collideRect([x0, y0, x1, y1], obj) {
    collideSeg(x0, y0, x1, y0, obj); collideSeg(x1, y0, x1, y1, obj);
    collideSeg(x1, y1, x0, y1, obj); collideSeg(x0, y1, x0, y0, obj);
  }

  function stepParts(dt) {
    for (const l of lifts) {
      const py = l.y;
      if (liftMoving(l)) { const d = l.target - l.y; l.y += Math.sign(d) * Math.min(Math.abs(d), l.speed * dt); }
      l.dy = l.y - py;
    }
    for (const c of crushers) c.bottom = crusherBottom(c, time);
    // Crane pallets: wait at one end, glide (eased) to the other, wait, glide back.
    for (const m of movers) {
      m.t += dt;
      const D = m.xb - m.xa, dur = D / m.speed, p = mod(m.t, 2 * (m.wait + dur));
      const u = p < m.wait ? 0 : p < m.wait + dur ? (1 - Math.cos(((p - m.wait) / dur) * Math.PI)) / 2

        active = d.pressed;
      }
      if (d.sensor) active = ball.alive && ball.x > d.sensor[0] && ball.x < d.sensor[1] && ball.y > d.top && ball.y < d.closed + 0.5 && !doorLocked(d);
      if (active) d.timer = d.hold; else d.timer = Math.max(0, d.timer - dt);

    jumpBuf = Math.max(0, jumpBuf - dt);

    if (boostFx) { boostFx.t += dt; if (boostFx.t > 0.4) boostFx = null; }

      if (fitT >= FIT_DUR) {

      jumpBuf = 0; jumpCool = JUMP_COOL; airT = 1; kickT = 0;
      ball.grounded = false; ball.on = null;

    } else if (jumpBuf > 0 && hasDouble && boosts > 0 && airT > COYOTE && kickT > 0.12) {

      // and on the way up it adds only up to a cap, so the highest jump comes from firing near the top.
      ball.vy = Math.min(ball.vy, Math.max(Math.min(ball.vy, 0) - BOOST_V, -BOOST_V * 1.15));

      ball.vx += clamp(input(), -0.9, 0.9) * BOOST_TILT;

      }
      sfxBoost(); buzz(10);
    }

    const s = input();
    beltV = 0;
    if (ball.grounded) {

    for (const v of vents) {

      const u = (v.y - ball.y) / v.h;

    ball.y += ball.vy * dt;

    const dyn = dynamicRects();

        collideSeg(e.ax, e.ay, e.bx, e.by, "static");

    if (prevOn !== ball.on) {

      if (ball.on && ball.on.isMover) ball.vx -= ball.on.vx;
    }

    // Spin: roll without slipping on the ground (relative to a belt), keep spinning in the air.
    if (ball.grounded) ball.omega = (ball.vx * -ball.ny + ball.vy * ball.nx - beltV) / R;
    ball.angle += ball.omega * dt;

    for (const c of crushers) if (circleRectOverlap(ball.x, ball.y, R, [c.x0, c.top, c.x1, c.bottom]) > 0.06) return breakBall("crush");
    for (const z of zaps) if (zapOn(z, time) && ball.x > z.x0 - 0.1 && ball.x < z.x1 + 0.1 && ball.y > z.y - R - 0.08 && ball.y < z.y) return breakBall("zap");
    for (const l of lasers) if (laserOn(l, time) && Math.abs(ball.x - l.x) < R * 0.9 && ball.y + R * 0.9 > l.y0 && ball.y - R * 0.9 < l.y1) return breakBall("laser");
    for (const m of melts) if (ball.x > m.x0 && ball.x < m.x1 && ball.y + R > m.y + 0.04) return breakBall("melt");
    if (ball.y > PIT_Y) return breakBall("pit");

    // Checkpoints and exit.
    for (let i = cpIndex + 1; i < CHECKPOINTS.length; i++) {

      if (ball.grounded && ball.x > c.x - 0.5 && Math.abs(ball.y - (c.y - R)) < 1.5) { cpIndex = i; $("cp").textContent = `${i + 1}/${CHECKPOINTS.length}`; buzz(20); sfxCheckpoint(); }
    }

  // Predict whether the current fall will break the ball.
  function fallDanger() {
    if (ball.grounded || !ball.alive || !LV) return 0;
    let best = Infinity;
    const dyn = dynamicRects().map((d) => ({ ax: d.r[0], ay: d.r[1], bx: d.r[2], by: d.r[1], ny: -1 }));
    for (const e of EDGES.concat(dyn)) {
      if (e.ny >= -0.3) continue;
      const lo = Math.min(e.ax, e.bx), hi = Math.max(e.ax, e.bx);

      if (y > ball.y && y < best) best = y;
    }

  function breakBall(why) {
