/* Layout: portrait = tall rounded body, square screen in a thin frame, one recessed control
   panel below (speakers + power on top, D-pad and four face buttons, Start/Select at the bottom).
   Landscape = the panel splits into two recessed halves either side of the screen. */

  --desk: #141417;
  --scr: 300px;
  --font-print: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-lcd: "Silkscreen", "Courier New", ui-monospace, monospace;
  --sodium: #ffb056;
  color-scheme: dark;
}

.console[data-shell="sunflower"] { --shell:#f2c419; --shell-hi:#f7d96a; --shell-lo:#bd9914; --panel:#e1b617; --bezel:#1d1d22; --bezel-hi:#46464a; --btn:#2a2a30; --btn-hi:#838387; --btn-lo:#17171a; --btn-ink:rgba(255,255,255,0.72); --dpad:#2a2a30; --dpad-hi:#66666a; --dpad-lo:#111113; --pill:#3a3a42; --pill-hi:#75757b; --pill-lo:#232328; --print:#5a4300; --sa:100%; }

.console[data-shell="indigo"] { --shell:#3c3a8f; --shell-hi:#807fb6; --shell-lo:#2f2d70; --panel:#4a4897; --bezel:#15151d; --bezel-hi:#3f3f46; --btn:#23224f; --btn-hi:#7f7f99; --btn-lo:#13132b; --btn-ink:rgba(255,255,255,0.72); --dpad:#23224f; --dpad-hi:#616080; --dpad-lo:#0e0e20; --pill:#2c2b5e; --pill-hi:#6b6b8e; --pill-lo:#1a1a38; --print:#c9c7ff; --sa:100%; }
.console[data-shell="graphite"] { --shell:#33363e; --shell-hi:#7a7c82; --shell-lo:#282a30; --panel:#41444c; --bezel:#15161a; --bezel-hi:#3f4043; --btn:#f08a2a; --btn-hi:#f6bb83; --btn-lo:#844c17; --btn-ink:#1d1f24; --dpad:#17181c; --dpad-hi:#58595c; --dpad-lo:#090a0b; --pill:#55585f; --pill-hi:#888a8f; --pill-lo:#333539; --print:#a3a9b5; --sa:100%; }
.console[data-shell="arctic"] { --shell:#eef0f2; --shell-hi:#f4f5f7; --shell-lo:#babbbd; --panel:#dddfe1; --bezel:#2a2d34; --bezel-hi:#505359; --btn:#c9ced6; --btn-hi:#e0e3e7; --btn-lo:#6f7176; --btn-ink:#1d1f24; --dpad:#2d3038; --dpad-hi:#686a70; --dpad-lo:#121316; --pill:#a8aeb8; --pill-hi:#c2c6cd; --pill-lo:#65686e; --print:#3d4350; --sa:100%; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 30%, #222228, var(--desk) 70%);
  color: #e6e9ef;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }

.console {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(8px, env(safe-area-inset-left, 0px));
}

/* ---------- Body ---------- */
.shell {
  position: relative;
  width: min(100%, 520px);
  height: 100%;
  border-radius: 56px;
  background:
    linear-gradient(160deg,
      color-mix(in srgb, var(--shell-hi) var(--sa), transparent) 0%,
      color-mix(in srgb, var(--shell) var(--sa), transparent) 32%,
      color-mix(in srgb, var(--shell) var(--sa), transparent) 70%,
      color-mix(in srgb, var(--shell-lo) var(--sa), transparent) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.5),
    inset 2px 0 0 rgba(255,255,255,0.22),
    inset -3px 0 4px rgba(0,0,0,0.12),
    inset 0 -5px 8px rgba(0,0,0,0.18),
    0 2px 0 var(--shell-lo),
    0 28px 50px rgba(0,0,0,0.55),
    0 8px 14px rgba(0,0,0,0.35);
  display: flex; flex-direction: column; align-items: center;
  padding: 0 20px 24px;
  isolation: isolate;
  overflow: hidden;
}
.land .shell {
  width: 100%;
  border-radius: 48px;
  flex-direction: row; align-items: stretch;
  padding: 16px;
  gap: 14px;
}
.grain { position: absolute; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%; }
.sheen { position: absolute; inset: 0; z-index: 0; pointer-events: none; border-radius: inherit; overflow: hidden; }
.sheen .blob {
  position: absolute; width: 150%; height: 110%; left: -40%; top: -45%;
  background: radial-gradient(closest-side, rgba(255,255,255,0.2), rgba(255,255,255,0.06) 45%, rgba(255,255,255,0) 72%);
  will-change: transform;
}
.sheen::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 1px 2px 3px rgba(255,255,255,0.35); }
.topbar, .center, .controls, .sticker { position: relative; z-index: 1; }

/* Power light in the top-right corner */
.topbar { width: 100%; height: 46px; flex: none; }
.land .topbar { position: absolute; inset: 0 0 auto 0; height: 0; }
.led { position: absolute; right: 34px; top: 20px; width: 8px; height: 8px; border-radius: 50%; background: #10260f; box-shadow: inset 0 1px 1px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.35); transition: background 0.3s, box-shadow 0.3s; }
.led-r { display: none; position: relative; right: auto; top: auto; margin-left: 6px; }
.land .topbar .led { display: none; }
.land .led-r { display: block; }
.land .half.right .row { justify-content: space-between; }
.console.on .led { background: #3dff4a; box-shadow: 0 0 6px #3dff4a, 0 0 14px rgba(61,255,74,0.5); }
.console.on .led.danger { background: #ff3b30; box-shadow: 0 0 6px #ff3b30, 0 0 14px rgba(255,59,48,0.55); animation: ledpulse 0.4s ease-in-out infinite alternate; }
@keyframes ledpulse { to { opacity: 0.35; } }

/* ---------- Screen ---------- */
.center { display: flex; flex-direction: column; align-items: center; flex: none; margin-bottom: 22px; }
.land .center { order: 2; justify-content: center; margin-bottom: 0; }
.bezel {
  position: relative;
  padding: 7px;
  border-radius: 30px;
  background: linear-gradient(170deg, var(--bezel-hi), var(--bezel) 45%);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 1px 0 2px rgba(255,255,255,0.35), inset 0 1px 2px rgba(255,255,255,0.12);
}
.screen {
  position: relative; width: var(--scr); height: var(--scr);
  border-radius: 23px;
  touch-action: none;
}
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.brand { height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--print); opacity: 0.85; }
.land .brand { height: 30px; }
.brand b { font: italic 700 15px/1 var(--font-print); letter-spacing: 0.06em; }
.brand span { font: 600 8px/1 var(--font-print); letter-spacing: 0.14em; padding: 2px 5px; border: 1px solid currentColor; border-radius: 3px; }

.lcd-fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.07) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 3px),
    radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,0.45) 100%);
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.7), inset 0 0 2px rgba(0,0,0,0.9);
}
.lcd-off { position: absolute; inset: 0; z-index: 8; border-radius: 23px; background: #050607; display: grid; place-items: center; transition: opacity 0.6s ease; }
.lcd-off span { font: 400 9px/1 var(--font-lcd); color: #23262b; letter-spacing: 0.08em; }
.console.on .lcd-off { opacity: 0; pointer-events: none; }
.glass { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 9; }
.glass .band {
  position: absolute; inset: -60%;
  background: linear-gradient(118deg,
    transparent 38%, rgba(255,255,255,0.06) 44%, rgba(255,255,255,0.02) 49%, transparent 53%,
    transparent 58%, rgba(255,255,255,0.03) 60%, transparent 63%);
  will-change: transform;
}
.glass canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.4; }
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(90% 60% at 22% -5%, rgba(255,255,255,0.045), transparent 60%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 1px 0 0 rgba(255,255,255,0.06);
}
.no-refl .blob, .no-refl .band, .no-refl .spec { display: none; }

/* In-screen UI (LCD) */
.lcd { position: absolute; z-index: 4; font: 400 10px/1.25 var(--font-lcd); color: #e6e9ef; text-shadow: 0 0 6px rgba(230,236,255,0.35), 0 1px 0 #000; letter-spacing: 0.02em; }
.lcd-hud { left: 0; right: 0; top: 0; border-radius: 23px 23px 0 0; padding: 9px 12px 12px; display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; font-size: clamp(7px, calc(var(--scr) * 0.028), 10px); background: linear-gradient(rgba(0,0,0,0.6), transparent); pointer-events: none; }
.lcd-hud .lv { color: var(--sodium); text-shadow: 0 0 6px rgba(255,176,86,0.5), 0 1px 0 #000; }
.lcd-hud .r { display: flex; gap: 0.8em; align-items: center; }
.lcd-hud .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8d97a8; vertical-align: 0; }
.pips { display: flex; gap: 4px; align-items: center; }
.pips i { width: 7px; height: 7px; border-radius: 2px; background: rgba(255,255,255,0.16); }
.pips i.on { background: #7dff9a; box-shadow: 0 0 6px #7dff9a; }
.lcd-hud .dot.live { background: #7dff9a; box-shadow: 0 0 6px #7dff9a; }
.lcd-hud .dot.warn { background: #ffa21a; }
.lcd-prompt { left: 50%; bottom: 10px; transform: translateX(-50%); padding: 4px 8px; background: rgba(0,0,0,0.72); border: 1px solid rgba(255,176,86,0.6); color: var(--sodium); white-space: nowrap; animation: blink 1s steps(2, start) infinite; pointer-events: none; }
.lcd-toast { left: 12px; right: 12px; bottom: 38px; padding: 6px 8px; text-align: center; background: rgba(6,8,14,0.85); border: 1px solid rgba(255,176,86,0.35); transition: opacity 0.35s; pointer-events: none; text-wrap: balance; }
@keyframes blink { 50% { opacity: 0.25; } }
.lcd-panel { inset: 0; z-index: 6; border-radius: 23px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; background: rgba(4,6,12,0.9); }
.lcd-panel h2 { margin: 0; font: 700 clamp(15px, calc(var(--scr) * 0.065), 22px)/1.05 var(--font-lcd); color: #fff; }
.lcd-panel .sub { color: var(--sodium); text-shadow: 0 0 8px rgba(255,176,86,0.55), 0 1px 0 #000; }
.lcd-panel p { margin: 0; color: #aab3c2; }
.lcd-panel .warn { color: #ffa21a; }
.lcd-panel .cta { text-shadow: 0 0 8px rgba(255,176,86,0.55), 0 1px 0 #000; color: var(--sodium); animation: blink 1s steps(2, start) infinite; margin-top: 4px; }
.lcd-panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; width: 100%; max-width: 240px; max-height: calc(var(--scr) - 76px); overflow-y: auto; scrollbar-width: none; }
.lcd-panel ul::-webkit-scrollbar { display: none; }
.lcd-panel li { padding: 4px 6px; text-align: left; color: #aab3c2; cursor: pointer; }
.lcd-panel li.sel { color: #111; background: var(--sodium); text-shadow: none; box-shadow: 0 0 12px rgba(255,176,86,0.45); }
.lcd-panel li.sel::before { content: "> "; }
.lib ul { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: none; max-height: none; overflow: visible; }
.lib li { display: flex; flex-direction: column; align-items: center; gap: 8px; width: calc(var(--scr) * 0.32); padding: 10px 8px 9px; border: 2px solid rgba(255,176,86,0.2); border-radius: 8px; text-align: center; }
.lib li.sel { color: #fff; background: rgba(255,176,86,0.1); border-color: var(--sodium); box-shadow: 0 0 14px rgba(255,176,86,0.45); text-shadow: 0 0 6px rgba(255,176,86,0.5), 0 1px 0 #000; }
.lib li.sel::before { content: none; }
.lib .cart { width: 100%; aspect-ratio: 1; border-radius: 6px; background: linear-gradient(180deg, #0b1430 0 62%, #2a313c 62% 68%, #161b22 68%); position: relative; overflow: hidden; }
.lib .cart::before { content: ""; position: absolute; left: 18%; top: 22%; width: 38%; height: 38%; border-radius: 50%; background: radial-gradient(circle, rgba(255,176,86,0.55), transparent 70%); }
.lib .cart::after { content: ""; position: absolute; left: 42%; top: 47%; width: 16%; height: 16%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a7c, #d32a33 55%, #4a0710); }
.stats { display: flex; gap: 6px; }
.stats div { padding: 5px 8px; border: 1px solid rgba(255,176,86,0.35); }
.stats b { display: block; font: 700 14px/1.1 var(--font-lcd); color: #fff; }
.stats span { font-size: 8px; color: #8d97a8; }
#bootPanel { background: #0a0c12; overflow: hidden; }
.boot-logo { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translateY(-260%); }
.boot-logo img { width: calc(var(--scr) * 0.64); height: auto; display: block; filter: drop-shadow(0 0 18px rgba(255,154,175,0.35)); }
.boot-logo .kana { font: 400 clamp(11px, calc(var(--scr) * 0.045), 15px)/1 "DotGothic16", var(--font-lcd); letter-spacing: 0.35em; padding-left: 0.35em; color: #7de3ff; text-shadow: 0 0 8px rgba(125,227,255,0.6); }
.boot-logo b {
  font: 400 clamp(30px, calc(var(--scr) * 0.15), 50px)/1 "Mochiy Pop One", "Arial Rounded MT Bold", system-ui, sans-serif;
  color: #fff6fb; letter-spacing: 0.02em;
  -webkit-text-stroke: 7px #ff4f9a; paint-order: stroke fill;
  text-shadow: 0 5px 0 #ffd23f, 0 0 18px rgba(255,79,154,0.55);
  transform: rotate(-4deg);
}
.boot-logo .spark { position: absolute; width: 14px; height: 14px; background: #ffd23f; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 4px rgba(255,210,63,0.8)); animation: twinkle 0.9s ease-in-out infinite alternate; }
.boot-logo .s1 { left: 2px; top: 22%; }
.boot-logo .s2 { right: 8px; top: 8%; width: 10px; height: 10px; background: #7de3ff; animation-delay: 0.3s; }
.boot-logo .s3 { right: -2px; bottom: 26%; animation-delay: 0.6s; }
.boot-logo .s4 { left: 12px; bottom: 12%; width: 9px; height: 9px; background: #ff9ccc; animation-delay: 0.45s; }
@keyframes twinkle { from { transform: scale(0.5) rotate(0deg); opacity: 0.4; } to { transform: scale(1.15) rotate(45deg); opacity: 1; } }
.boot-logo.drop { animation: drop 1.3s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes drop { to { transform: translateY(0); } }
.boot-legal { position: absolute; bottom: 14px; font: 400 9px/1 "DotGothic16", var(--font-lcd); letter-spacing: 0.08em; color: #5b6272; }

/* ---------- Control panel (recessed) ---------- */
.controls {
  width: 100%; flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  border-radius: 30px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) var(--sa), transparent), color-mix(in srgb, var(--panel) var(--sa), transparent));
  box-shadow: inset 0 3px 7px rgba(0,0,0,0.2), inset 0 1px 2px rgba(0,0,0,0.18), 0 1px 0 rgba(255,255,255,0.45);
  padding: 18px 18px 22px;
}
.half { display: flex; flex-direction: column; min-width: 0; }

.land .power { left: auto; right: 16px; transform: none; top: 16px; }
.power .slot { position: relative; width: 58px; height: 22px; border-radius: 11px; background: color-mix(in srgb, var(--pill) 60%, #000); box-shadow: inset 0 2px 4px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.45); }

  // ===================== Lift / Use =====================
  function useContext() {

  // ===================== Dynamic colliders =====================
  function crusherBottom(c, t) {
    const p = ((t + c.phase) % CRUSH.period + CRUSH.period) % CRUSH.period;

  function dynamicRects() {
    const out = [{ r: [lift.x0, lift.y, lift.x1, lift.y + 0.3], obj: lift }];

  function circleRectOverlap(cx, cy, r, [x0, y0, x1, y1]) {

  // ===================== Physics step =====================
  function collideSeg(ax, ay, bx, by, obj) {

    const qx = ax + ex * t, qy = ay + ey * t;

  // Predict whether the current fall will break the ball.
  function fallDanger() {

  function breakBall(why) {

  function sparks(x, y, n, blue) {

  function spawn(i, resetCP) {
    if (resetCP) { cpIndex = 0; $("cp").textContent = `1/${CHECKPOINTS.length}`; }
    const c = CHECKPOINTS[i ?? cpIndex];
    Object.assign(ball, { x: c.x, y: c.y - R - 0.01, vx: 0, vy: 0, omega: 0, grounded: false, on: null, alive: true, spawnT: 0.6 });
    door.timer = 0;
  }
  function finish() {
    if (finished) return;
    finished = true;
    const m = Math.floor(time / 60), s = Math.floor(time % 60);
    $("doneTime").textContent = `${m}:${String(s).padStart(2, "0")}`;
    $("doneBreaks").textContent = breaks;
    $("doneTop").textContent = topSpeed.toFixed(1);
    setTimeout(() => showPanel("done"), 700);
    buzz([30, 40, 30]);
  }

  function showToast(text) {
    const t = $("toast");
    t.textContent = text; t.style.opacity = "1"; toastTimer = 5;
  }

  // ===================== Rendering =====================
  function polyPath(g, pts) {
    g.beginPath();
    pts.forEach(([x, y], i) => (i ? g.lineTo(sx(x), sy(y)) : g.moveTo(sx(x), sy(y))));
    g.closePath();
  }

  function drawBackdrop(t) {
    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, "#020309");
    sky.addColorStop(0.6, "#070b18");
    sky.addColorStop(1, "#15110f");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, VH);

    const far = 0.1, mid = 0.3;
    const farBase = VH * 0.8 - camY * PX * 0.05;
    const off1 = ((camX * PX * far) % TILE + TILE) % TILE;
    for (let x = -off1; x < VW; x += TILE) blit(skyline, x, farBase - skyline.height);
    if (skyTower && Math.sin(t * 2.2) > 0.2) {
      for (let x = -off1; x < VW; x += TILE) {
        const lx = x + skyTower.x, ly = farBase - skyline.height + skyTower.top - 4;
        const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 14);
        g.addColorStop(0, "rgba(255,60,50,0.9)"); g.addColorStop(1, "rgba(255,60,50,0)");
        ctx.fillStyle = g; ctx.fillRect(lx - 14, ly - 14, 28, 28);
      }
    }
    ctx.fillStyle = "#080b16";
    ctx.fillRect(0, farBase, VW, VH - farBase);

    const midBase = VH * 0.92 - camY * PX * 0.12;
    const off2 = ((camX * PX * mid) % TILE + TILE) % TILE;
    for (let x = -off2; x < VW; x += TILE) blit(midline, x, midBase - midline.height);
    ctx.fillStyle = "#070a12";
    ctx.fillRect(0, midBase - 1, VW, VH - midBase + 1);
  }

  // Copy only the visible slice of a wide backdrop tile.
  function blit(img, x, y) {
    const sx0 = Math.max(0, -x), sx1 = Math.min(img.width, VW - x);
    const sy0 = Math.max(0, -y), sy1 = Math.min(img.height, VH - y);
    if (sx1 <= sx0 || sy1 <= sy0) return;
    ctx.drawImage(img, sx0, sy0, sx1 - sx0, sy1 - sy0, x + sx0, y + sy0, sx1 - sx0, sy1 - sy0);
  }

  function drawColumn(g, x, y0) {
    const X = sx(x), Y0 = sy(y0), Y1 = sy(PIT_Y + 2), w = 0.24 * PX;
    g.fillStyle = "#12161d";
    g.fillRect(X - w / 2, Y0, w, Y1 - Y0);
    g.fillStyle = "#1b212b";
    g.fillRect(X - w / 2, Y0, w * 0.18, Y1 - Y0);
    g.strokeStyle = "#12161d"; g.lineWidth = Math.max(1, 0.05 * PX);
    const step = 1.6 * PX;
    g.beginPath();
    for (let y = Y0; y < Y1; y += step) { g.moveTo(X - w * 1.6, y); g.lineTo(X + w * 1.6, y + step); g.moveTo(X + w * 1.6, y); g.lineTo(X - w * 1.6, y + step); }
    g.stroke();
  }

  function drawSolid(g, poly) {
    polyPath(g, poly);
    const ys = poly.map((p) => p[1]);
    const grd = g.createLinearGradient(0, sy(Math.min(...ys)), 0, sy(Math.max(...ys)));
    grd.addColorStop(0, "#2a313c");
    grd.addColorStop(1, "#141920");
    g.fillStyle = grd;
    g.fill();
    g.save();
    g.clip();
    // Panel seams every 2 m.
    g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = 1;
    const xs = poly.map((p) => p[0]);
    for (let x = Math.ceil(Math.min(...xs) / 2) * 2; x < Math.max(...xs); x += 2) {
      g.beginPath(); g.moveTo(sx(x), sy(Math.min(...ys))); g.lineTo(sx(x), sy(Math.max(...ys))); g.stroke();
    }
    g.restore();
  }

  function drawTopEdges(g) {
    // Tread-plate band, highlight lip and rivets on every walkable surface.
    for (const e of EDGES) {
      if (e.ny > -0.5) continue;
      const len = Math.hypot(e.bx - e.ax, e.by - e.ay), ux = (e.bx - e.ax) / len, uy = (e.by - e.ay) / len;
      const band = 0.16;
      g.fillStyle = "#3a4350";
      g.beginPath();
      g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by));
      g.lineTo(sx(e.bx - e.nx * band), sy(e.by - e.ny * band)); g.lineTo(sx(e.ax - e.nx * band), sy(e.ay - e.ny * band));
      g.closePath(); g.fill();
      g.strokeStyle = "rgba(255,255,255,0.08)"; g.lineWidth = Math.max(1, 0.03 * PX);
      g.beginPath();
      for (let d = 0.1; d < len; d += 0.22) {
        const x = e.ax + ux * d, y = e.ay + uy * d - e.ny * 0.08;
        g.moveTo(sx(x - 0.05), sy(y - 0.03)); g.lineTo(sx(x + 0.05), sy(y + 0.03));
      }
      g.stroke();
      g.strokeStyle = "#7d8899"; g.lineWidth = Math.max(1, 0.035 * PX);
      g.beginPath(); g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by)); g.stroke();
      g.fillStyle = "#59636f";
      for (let d = 0.25; d < len; d += 0.5) {
        const x = e.ax + ux * d - e.nx * 0.26, y = e.ay + uy * d - e.ny * 0.26;
        g.beginPath(); g.arc(sx(x), sy(y), Math.max(1, 0.03 * PX), 0, 6.283); g.fill();
      }
    }
  }

  function hazardStripes(g, x0, y0, x1, y1) {
    g.save();
    g.beginPath(); g.rect(sx(x0), sy(y0), (x1 - x0) * PX, (y1 - y0) * PX); g.clip();
    g.fillStyle = "#c99a1d"; g.fillRect(sx(x0), sy(y0), (x1 - x0) * PX, (y1 - y0) * PX);
    g.fillStyle = "#14161a";
    const w = 0.18 * PX;
    for (let x = sx(x0) - (y1 - y0) * PX; x < sx(x1); x += w * 2) {
      g.beginPath(); g.moveTo(x, sy(y1)); g.lineTo(x + w, sy(y1)); g.lineTo(x + w + (y1 - y0) * PX, sy(y0)); g.lineTo(x + (y1 - y0) * PX, sy(y0)); g.closePath(); g.fill();
    }
    g.restore();
  }

  function drawWorld(t) {
    const g = wctx;
    g.clearRect(0, 0, VW, VH);

    for (const [x, y] of COLUMNS) if (Math.abs(x - camX) * PX < VW) drawColumn(g, x, y);

    // Lift shaft rails behind the lift.
    g.fillStyle = "#151a22";
    g.fillRect(sx(56.5), sy(0.4), 0.12 * PX, (10.35 - 0.4) * PX);
    g.fillRect(sx(59.38), sy(0.4), 0.12 * PX, (10.35 - 0.4) * PX);
    g.strokeStyle = "#1c222b"; g.lineWidth = 1;
    g.beginPath(); for (let y = 0.8; y < 10.3; y += 0.6) { g.moveTo(sx(56.6), sy(y)); g.lineTo(sx(59.4), sy(y + 0.6)); } g.stroke();

    // Lamp posts and hanging lamps.
    for (const L of LAMPS) {
      const X = sx(L.x), top = sy(L.y - L.h);
      g.fillStyle = "#1a1f27";
      g.fillRect(X - 0.05 * PX, top, 0.1 * PX, L.h * PX);
      g.fillRect(X, top, 0.7 * PX, 0.07 * PX);
      g.fillStyle = "#2a2f38";
      g.fillRect(X + 0.4 * PX, top + 0.05 * PX, 0.36 * PX, 0.12 * PX);
    }
    for (const L of HANGING) {
      g.strokeStyle = "#1a1f27"; g.lineWidth = Math.max(1, 0.03 * PX);
      g.beginPath(); g.moveTo(sx(L.x), sy(L.y)); g.lineTo(sx(L.x), sy(L.y + L.len)); g.stroke();
      g.fillStyle = "#262c35";
      g.beginPath(); g.moveTo(sx(L.x - 0.1), sy(L.y + L.len)); g.lineTo(sx(L.x + 0.1), sy(L.y + L.len));
      g.lineTo(sx(L.x + 0.3), sy(L.y + L.len + 0.22)); g.lineTo(sx(L.x - 0.3), sy(L.y + L.len + 0.22)); g.closePath(); g.fill();
    }

    // Signs.
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `600 ${Math.max(8, Math.round(0.2 * PX))}px "IBM Plex Mono", ui-monospace, monospace`;
    for (const S of SIGNS) {
      const w = (S.text.length * 0.13 + 0.36);
      g.fillStyle = "#1a1f27";
      g.fillRect(sx(S.x) - 0.03 * PX, sy(S.y - 1.3), 0.06 * PX, 1.3 * PX);
      hazardStripes(g, S.x - w / 2, S.y - 1.86, S.x + w / 2, S.y - 1.78);
      g.fillStyle = "#14171c";
      g.fillRect(sx(S.x - w / 2), sy(S.y - 1.78), w * PX, 0.48 * PX);
      g.strokeStyle = "#c99a1d"; g.lineWidth = 1;
      g.strokeRect(sx(S.x - w / 2) + 0.5, sy(S.y - 1.78) + 0.5, w * PX - 1, 0.48 * PX - 1);
      g.fillStyle = "#f0c24a";
      g.fillText(S.text, sx(S.x), sy(S.y - 1.54));
    }

    // Checkpoint posts.
    CHECKPOINTS.forEach((c, i) => {
      if (i === 0) return;
      g.fillStyle = "#1a1f27";
      g.fillRect(sx(c.x + 0.6) - 0.04 * PX, sy(c.y - 1.1), 0.08 * PX, 1.1 * PX);
      g.fillStyle = i <= cpIndex ? "#7dff9a" : "#2b3a30";
      g.beginPath(); g.arc(sx(c.x + 0.6), sy(c.y - 1.15), 0.09 * PX, 0, 6.283); g.fill();
    });

    // Exit gate.
    g.fillStyle = "#10141a";
    g.fillRect(sx(117.6), sy(6.6), 2.2 * PX, 3.4 * PX);
    g.fillStyle = "#0a1a10";
    g.fillRect(sx(117.9), sy(6.9), 1.6 * PX, 3.1 * PX);
    g.fillStyle = "#5dff8f";
    g.font = `700 ${Math.round(0.3 * PX)}px "Chakra Petch", sans-serif`;
    g.fillText("EXIT", sx(118.7), sy(6.25));

    for (const poly of SOLIDS) drawSolid(g, poly);
    drawTopEdges(g);

    // Drop-edge warning stripes.
    hazardStripes(g, 33.3, 3.0, 34, 3.15);
    hazardStripes(g, 103.3, 9.0, 104, 9.15);
    hazardStripes(g, 107, 10.0, 107.7, 10.15);

    // Electrified plate.
    const on = zapOn(t), warn = zapWarn(t);
    g.fillStyle = on ? "#9fdcff" : warn ? "#3c5566" : "#20303b";
    g.fillRect(sx(zap.x0), sy(zap.y) - 0.05 * PX, (zap.x1 - zap.x0) * PX, 0.12 * PX);
    g.fillStyle = "#0b0f14";
    for (let x = zap.x0 + 0.2; x < zap.x1; x += 0.4) g.fillRect(sx(x), sy(zap.y) - 0.05 * PX, 0.05 * PX, 0.12 * PX);

    // Pressure plate and the indicator cable to the door.
    g.fillStyle = plate.pressed ? "#c99a1d" : "#7a6420";
    g.fillRect(sx(plate.x0), sy(plate.y) - (plate.pressed ? 0.02 : 0.08) * PX, (plate.x1 - plate.x0) * PX, 0.1 * PX);
    const lamps = 8, lit = Math.ceil((door.timer / door.HOLD) * lamps);
    for (let i = 0; i < lamps; i++) {
      const x = lerp(plate.x1 + 0.4, door.x0 - 0.4, i / (lamps - 1));
      g.fillStyle = i < lit ? "#ffcf6b" : "#2b2a24";
      g.beginPath(); g.arc(sx(x), sy(6.35), 0.06 * PX, 0, 6.283); g.fill();
    }

    // Door.
    g.fillStyle = "#2b323d";
    g.fillRect(sx(door.x0), sy(door.top), (door.x1 - door.x0) * PX, (door.bottom - door.top) * PX);
    hazardStripes(g, door.x0, door.bottom - 0.25, door.x1, door.bottom);
    g.fillStyle = door.timer > 0 ? "#7dff9a" : "#ff3b30";
    g.beginPath(); g.arc(sx(82.2), sy(1.75), 0.07 * PX, 0, 6.283); g.fill();

    // Crushers.
    for (const c of crushers) {
      g.fillStyle = "#1a1f27";
      g.fillRect(sx((c.x0 + c.x1) / 2 - 0.12), sy(0.4), 0.24 * PX, (c.bottom - 0.9 + 0.5) * PX);
      g.fillStyle = "#343c48";
      g.fillRect(sx(c.x0), sy(c.bottom - 0.5), (c.x1 - c.x0) * PX, 0.5 * PX);
      hazardStripes(g, c.x0, c.bottom - 0.14, c.x1, c.bottom);
    }

    // Lift platform with a cage and gates.
    const ly = lift.y;
    g.fillStyle = "#39414d";
    g.fillRect(sx(lift.x0), sy(ly), (lift.x1 - lift.x0) * PX, 0.3 * PX);
    hazardStripes(g, lift.x0, ly, lift.x1, ly + 0.1);
    g.strokeStyle = "#2a313b"; g.lineWidth = Math.max(1, 0.04 * PX);
    g.beginPath();
    g.moveTo(sx(lift.x0 + 0.05), sy(ly)); g.lineTo(sx(lift.x0 + 0.05), sy(ly - 2.2));
    g.lineTo(sx(lift.x1 - 0.05), sy(ly - 2.2)); g.lineTo(sx(lift.x1 - 0.05), sy(ly));
    g.stroke();
    g.fillStyle = "#2a313b";
    g.fillRect(sx(57.4), sy(ly - 2.35), 1.2 * PX, 0.15 * PX);
    if (!atBottom()) hazardStripes(g, 56.2, 8.6, 56.5, 10);
    if (!atTop()) hazardStripes(g, 59.5, 2.7, 59.8, 4);

    // Beacons.
    for (const b of BEACONS) {
      g.fillStyle = "#1a1f27";
      g.fillRect(sx(b.x) - 0.06 * PX, sy(b.y) - 0.16 * PX, 0.12 * PX, 0.16 * PX);
      g.fillStyle = Math.sin(t * 6 + b.x) > 0 ? "#ffa21a" : "#4a3210";
      g.beginPath(); g.arc(sx(b.x), sy(b.y - 0.2), 0.07 * PX, 0, 6.283); g.fill();
    }

    drawBall(g, t);
    drawParticles(g, false);
  }

  function drawBall(g, t) {
    if (!ball.alive) return;
    const X = sx(ball.x), Y = sy(ball.y);
    const pop = ball.spawnT > 0 ? 1 - ball.spawnT / 0.6 : 1;
    const r = R * PX * (0.6 + 0.4 * pop);
    g.save();
    g.globalAlpha = clamp(pop * 1.2, 0, 1);
    // Contact shadow.
    if (ball.grounded) {
      g.fillStyle = "rgba(0,0,0,0.5)";
      g.beginPath(); g.ellipse(X, Y + r * 0.95, r * 0.9, r * 0.18, 0, 0, 6.283); g.fill();
    }
    const body = g.createRadialGradient(X - r * 0.35, Y - r * 0.4, r * 0.05, X, Y, r);
    body.addColorStop(0, "#f06a5f");
    body.addColorStop(0.35, "#c3242c");
    body.addColorStop(0.8, "#6e0f17");
    body.addColorStop(1, "#2a0609");
    g.fillStyle = body;
    g.beginPath(); g.arc(X, Y, r, 0, 6.283); g.fill();
    // Seam where the middle ring will one day split off.
    g.strokeStyle = "rgba(0,0,0,0.5)"; g.lineWidth = Math.max(1, r * 0.06);
    g.beginPath(); g.arc(X, Y, r * 0.68, 0, 6.283); g.stroke();
    g.strokeStyle = "rgba(255,200,190,0.18)"; g.lineWidth = 1;
    g.beginPath(); g.arc(X, Y, r * 0.72, -2.2, -0.8); g.stroke();
    // Bolts turn with the roll.
    for (let i = 0; i < 4; i++) {
      const a = ball.angle + i * Math.PI / 2;
      g.fillStyle = "rgba(210,210,215,0.75)";
      g.beginPath(); g.arc(X + Math.cos(a) * r * 0.84, Y + Math.sin(a) * r * 0.84, Math.max(1, r * 0.07), 0, 6.283); g.fill();
    }
    // Hub with status light.
    g.fillStyle = "#1c2027";
    g.beginPath(); g.arc(X, Y, r * 0.3, 0, 6.283); g.fill();
    const danger = dangerNow;
    g.fillStyle = danger === 2 ? "#ff3b30" : danger === 1 ? "#ffa21a" : "#7dff9a";
    g.beginPath(); g.arc(X, Y, r * 0.13, 0, 6.283); g.fill();
    g.fillStyle = "rgba(255,255,255,0.45)";
    g.beginPath(); g.ellipse(X - r * 0.38, Y - r * 0.45, r * 0.2, r * 0.11, -0.7, 0, 6.283); g.fill();
    g.restore();
  }

  function drawParticles(g, additive) {
    for (const p of particles) {
      if ((p.kind === "spark") !== additive) continue;
      if (p.kind === "shard") {
        g.save();
        g.translate(sx(p.x), sy(p.y)); g.rotate(p.rot);
        g.fillStyle = `rgba(190,40,45,${clamp(p.life, 0, 1)})`;
        const s = p.size * PX;
        g.beginPath(); g.moveTo(-s, -s * 0.6); g.lineTo(s, 0); g.lineTo(-s * 0.4, s * 0.8); g.closePath(); g.fill();
        g.restore();
      } else {
        const a = clamp(p.life * 2, 0, 1);
        g.strokeStyle = p.blue ? `rgba(160,220,255,${a})` : `rgba(255,190,90,${a})`;
        g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(sx(p.x), sy(p.y)); g.lineTo(sx(p.x - p.vx * 0.03), sy(p.y - p.vy * 0.03)); g.stroke();
      }
    }
  }

  function lights(t) {
    const out = [];
    for (const L of LAMPS) {
      let i = 0.95;
      if (L.flicker) { const f = Math.sin(t * 23) * Math.sin(t * 7.3 + 1) * Math.sin(t * 1.7); if (f > 0.35) i = 0.25; }
      out.push({ x: L.x + 0.58, y: L.y - L.h + 0.2, r: 5.5, i, c: L.color, cone: L.y });
    }
    for (const L of HANGING) out.push({ x: L.x, y: L.y + L.len + 0.25, r: 4.6, i: 0.9, c: L.color, cone: L.y + L.len + 3.4 });
    for (const b of BEACONS) if (Math.sin(t * 6 + b.x) > 0) out.push({ x: b.x, y: b.y - 0.2, r: 2.2, i: 0.6, c: [255, 162, 26] });
    if (zapOn(t)) out.push({ x: (zap.x0 + zap.x1) / 2, y: zap.y - 0.2, r: 3.5, i: 0.85, c: [140, 210, 255] });
    out.push({ x: (lift.x0 + lift.x1) / 2, y: lift.y - 2.1, r: 3, i: 0.7, c: [205, 225, 255] });
    for (const c of crushers) {
      const p = ((t + c.phase) % CRUSH.period + CRUSH.period) % CRUSH.period;
      if (p > 1.25 && p < 2.05) out.push({ x: (c.x0 + c.x1) / 2, y: 0.7, r: 2.4, i: 0.8, c: [255, 60, 48] });
    }
    out.push({ x: 82.2, y: 1.75, r: 1.6, i: 0.6, c: door.timer > 0 ? [125, 255, 154] : [255, 59, 48] });
    CHECKPOINTS.forEach((c, i) => { if (i > 0 && i <= cpIndex) out.push({ x: c.x + 0.6, y: c.y - 1.15, r: 1.8, i: 0.6, c: [125, 255, 154] }); });
    out.push({ x: 118.7, y: 6.3, r: 4.5, i: 0.9, c: [93, 255, 143] });
    if (ball.alive) out.push({ x: ball.x, y: ball.y, r: 1.5, i: 0.55, c: [255, 120, 110] });
    return out.filter((L) => Math.abs(sx(L.x) - VW / 2) < VW / 2 + L.r * PX && Math.abs(sy(L.y) - VH / 2) < VH / 2 + L.r * PX);
  }

  function applyLighting(list) {
    const g = lctx;
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, VW, VH);
    g.fillStyle = "rgba(0,0,0,0.9)";
    g.fillRect(0, 0, VW, VH);
    g.globalCompositeOperation = "destination-out";
    for (const L of list) {
      const X = sx(L.x), Y = sy(L.y), r = L.r * PX;
      const grd = g.createRadialGradient(X, Y, 0, X, Y, r);
      grd.addColorStop(0, `rgba(0,0,0,${L.i})`);
      grd.addColorStop(0.45, `rgba(0,0,0,${L.i * 0.45})`);
      grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd;
      g.fillRect(X - r, Y - r, r * 2, r * 2);
    }
    wctx.globalCompositeOperation = "source-atop";
    wctx.drawImage(lcv, 0, 0, VW, VH);
    wctx.globalCompositeOperation = "source-over";
  }

  function drawGlows(list) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const L of list) {
      const [r, g, b] = L.c;
      const X = sx(L.x), Y = sy(L.y), rad = L.r * PX;
      const tint = ctx.createRadialGradient(X, Y, 0, X, Y, rad);
      tint.addColorStop(0, `rgba(${r},${g},${b},${0.14 * L.i})`);
      tint.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = tint;

    for (const el of stickerEls) {
      const id = el.dataset.id, d = STICKER_DEFAULTS[k][id], p = stickerPos[k][id] || d;
      el.style.setProperty("--x", p[0]);
      el.style.setProperty("--y", p[1]);
      el.style.setProperty("--rot", d[2] + "deg");
    }
  }
  function saveStickers() { try { localStorage.setItem("piko.stickers", JSON.stringify(stickerPos)); } catch (_) {} }
  function resetStickers() { stickerPos = { port: {}, land: {} }; saveStickers(); placeStickers(); }
  for (const el of stickerEls) {
    let timer = 0, lifted = false, x0 = 0, y0 = 0, pid = null;
    const cancel = () => { clearTimeout(timer); timer = 0; };
    el.addEventListener("contextmenu", (e) => e.preventDefault());
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      pid = e.pointerId; x0 = e.clientX; y0 = e.clientY;
      try { el.setPointerCapture(pid); } catch (_) {}
      cancel();
      timer = setTimeout(() => { timer = 0; lifted = true; el.classList.add("lift"); buzz(18); tone(988, 0, 0.05, "square", 0.03); }, 380);
    });
    el.addEventListener("pointermove", (e) => {
      if (e.pointerId !== pid) return;
      if (!lifted) { if (Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); return; }
      const r = $("shell").getBoundingClientRect();
      const hw = (el.offsetWidth / 2 / r.width) * 100 * 0.5, hh = (el.offsetHeight / 2 / r.height) * 100 * 0.5;
      const x = clamp(((e.clientX - r.left) / r.width) * 100, hw, 100 - hw);
      const y = clamp(((e.clientY - r.top) / r.height) * 100, hh, 100 - hh);
      el.style.setProperty("--x", x.toFixed(2));
      el.style.setProperty("--y", y.toFixed(2));
    });
    const end = (e) => {
      if (e.pointerId !== pid) return;
      cancel(); pid = null;
      if (!lifted) return;
      lifted = false; el.classList.remove("lift");
      stickerPos[orientKey()][el.dataset.id] = [parseFloat(el.style.getPropertyValue("--x")), parseFloat(el.style.getPropertyValue("--y"))];
      saveStickers();
      tone(659, 0, 0.06, "square", 0.03);
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }
  let pipsShown = -1;

  applyShell();
  applyRefl();
  // Offline support once installed (only on http/https).
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  fitConsole();
  window.addEventListener("resize", fitConsole);
  new ResizeObserver(() => resize()).observe($("screen"));

  if (location.hash === "#debug") {
    window.__game = { onA, onStart, get panel() { return panel; }, ball, lift, crushers, door, get time() { return time; }, get finished() { return finished; }, get breaks() { return breaks; }, get cp() { return cpIndex; }, zapOn: () => zapOn(time), useContext, danger: fallDanger };
  }

  window.addEventListener("resize", resize);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener("change", () => setTimeout(resize, 150));
  resize();
  requestAnimationFrame(frame);
})();
