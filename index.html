    sfxBreak(why);
    buzz(why === "retry" ? 15 : [40, 30, 60]);
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
      particles.push({ kind: "shard", x: ball.x, y: ball.y, vx: Math.cos(a) * s + ball.vx * 0.3, vy: Math.sin(a) * s - 2, life: 1.4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, size: 0.05 + Math.random() * 0.08 });
    }
    sparks(ball.x, ball.y, why === "zap" || why === "laser" || why === "melt" ? 30 : 18, why === "zap" ? "blue" : why === "laser" ? "red" : null);
    if (why === "melt") for (let i = 0; i < 24; i++) particles.push({ kind: "ember", x: ball.x + (Math.random() - 0.5) * 0.8, y: ball.y, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() * 3, life: 0.8 + Math.random() * 1.2 });
  }
  function sparks(x, y, n, tint) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, s = 2 + Math.random() * 6;
      particles.push({ kind: "spark", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.4, tint });
    }
  }
  function spawn(i, resetCP) {
    if (resetCP) { cpIndex = 0; $("cp").textContent = `1/${CHECKPOINTS.length}`; pipsShown = -1; }
    const c = CHECKPOINTS[i ?? cpIndex];
    Object.assign(ball, { x: c.x, y: c.y - R - 0.01, vx: 0, vy: 0, omega: 0, grounded: false, on: null, alive: true, spawnT: 0.6 });
    for (const d of doors) d.timer = 0;
    jumpBuf = 0; airT = 0;
  }
  function finish() {
    if (finished) return;
    finished = true;
    const m = Math.floor(time / 60), s = Math.floor(time % 60);
    $("doneTime").textContent = `${m}:${String(s).padStart(2, "0")}`;
    $("doneBreaks").textContent = breaks;
    $("doneTop").textContent = topSpeed.toFixed(1);
    markCleared(LV.id);
    setTimeout(() => showPanel("done"), 700);
    buzz([30, 40, 30]);
  }

  function showToast(text) {
    const t = $("toast");
    t.textContent = text; t.style.opacity = "1"; toastTimer = 4;
  }

  // ===================== Rendering =====================
  const onScreenX = (x0, x1, pad = 0) => sx(x1) > -pad && sx(x0) < VW + pad;

  function polyPath(g, pts) {
    g.beginPath();
    pts.forEach(([x, y], i) => (i ? g.lineTo(sx(x), sy(y)) : g.moveTo(sx(x), sy(y))));
    g.closePath();
  }

  // Copy only the visible slice of a wide backdrop tile.
  function blit(img, x, y) {
    const sx0 = Math.max(0, -x), sx1 = Math.min(img.width, VW - x);
    const sy0 = Math.max(0, -y), sy1 = Math.min(img.height, VH - y);
    if (sx1 <= sx0 || sy1 <= sy0) return;
    ctx.drawImage(img, sx0, sy0, sx1 - sx0, sy1 - sy0, x + sx0, y + sy0, sx1 - sx0, sy1 - sy0);
  }

  function drawBackdrop(t) {
    if (TH.backdrop === "yard") {
      const farBase = VH * 0.8 - camY * PX * 0.05;
      if (farBase > skyline.height) { ctx.fillStyle = "#020309"; ctx.fillRect(0, 0, VW, farBase - skyline.height + 1); }
      const off1 = mod(camX * PX * 0.1, TILE);
      for (let x = -off1; x < VW; x += TILE) blit(skyline, x, farBase - skyline.height);
      if (skyTower && Math.sin(t * 2.2) > 0.2) {
        for (let x = -off1; x < VW; x += TILE) {
          const lx = x + skyTower.x, ly = farBase - skyline.height + skyTower.top - 4;
          const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 14);
          g.addColorStop(0, "rgba(255,60,50,0.9)"); g.addColorStop(1, "rgba(255,60,50,0)");
          ctx.fillStyle = g; ctx.fillRect(lx - 14, ly - 14, 28, 28);
        }
      }
      ctx.fillStyle = "#080b16";
      ctx.fillRect(0, farBase, VW, VH - farBase);
      const midBase = VH * 0.92 - camY * PX * 0.12;
      const off2 = mod(camX * PX * 0.3, TILE);
      for (let x = -off2; x < VW; x += TILE) blit(midline, x, midBase - midline.height);
      ctx.fillStyle = "#070a12";
      ctx.fillRect(0, midBase - 1, VW, VH - midBase + 1);
      return;
    }
    if (TH.backdrop === "foundry") {
      const farBase = VH * 0.85 - camY * PX * 0.06;
      if (farBase > skyline.height) { ctx.fillStyle = "#070404"; ctx.fillRect(0, 0, VW, farBase - skyline.height + 1); }
      const off1 = mod(camX * PX * 0.1, TILE);
      for (let x = -off1; x < VW; x += TILE) blit(skyline, x, farBase - skyline.height);
      // The far pour breathes: a warm glow along the floor of the hall.
      const pulse = 0.8 + 0.2 * Math.sin(t * 1.7) * Math.sin(t * 0.63 + 1);
      const gl = ctx.createLinearGradient(0, farBase - VH * 0.35, 0, farBase);
      gl.addColorStop(0, "rgba(255,110,30,0)"); gl.addColorStop(1, `rgba(255,110,30,${(0.2 * pulse).toFixed(3)})`);
      ctx.fillStyle = gl;
      ctx.fillRect(0, farBase - VH * 0.35, VW, VH * 0.35);
      ctx.fillStyle = "#1c0b06";
      ctx.fillRect(0, farBase, VW, VH - farBase);
      const midBase = VH * 0.95 - camY * PX * 0.14;
      const off2 = mod(camX * PX * 0.3, TILE);
      for (let x = -off2; x < VW; x += TILE) blit(midline, x, midBase - midline.height);
      ctx.fillStyle = "#0c0706";
      ctx.fillRect(0, midBase - 1, VW, VH - midBase + 1);
      return;
    }
    // Indoors: the city (with its sky baked in) is seen through the wall's windows; the wall covers the rest.
    const wy = VH * 0.5 - wallTile.height * 0.5 - (camY - 4) * PX * 0.3;
    const farBase = wy + wallTile.height * 0.62;
    const off1 = mod(camX * PX * 0.08, TILE);
    for (let x = -off1; x < VW; x += TILE) blit(skyline, x, farBase - skyline.height);
    const off2 = mod(camX * PX * 0.5, TILE);
    for (let x = -off2; x < VW; x += TILE) blit(wallTile, x, wy);
    if (wy > 0) { ctx.fillStyle = "#0d121a"; ctx.fillRect(0, 0, VW, wy + 1); }
    const wb = wy + wallTile.height;
    if (wb < VH) { ctx.fillStyle = "#0b0f15"; ctx.fillRect(0, wb - 1, VW, VH - wb + 1); }
  }

  function drawColumn(g, x, y0) {
    const X = sx(x), Y0 = sy(y0), Y1 = sy(PIT_Y + 2), w = 0.24 * PX;
    g.fillStyle = "#12161d";
    g.fillRect(X - w / 2, Y0, w, Y1 - Y0);
    g.fillStyle = "#1b212b";
    g.fillRect(X - w / 2, Y0, w * 0.18, Y1 - Y0);
    g.strokeStyle = "#12161d"; g.lineWidth = Math.max(1, 0.05 * PX);
    const st = 1.6 * PX;
    g.beginPath();
    for (let y = Y0; y < Y1; y += st) { g.moveTo(X - w * 1.6, y); g.lineTo(X + w * 1.6, y + st); g.moveTo(X + w * 1.6, y); g.lineTo(X - w * 1.6, y + st); }
    g.stroke();
  }
  function drawPillar(g, x, y0, y1) {
    const X = sx(x), w = 0.5 * PX, Y0 = sy(y0), Y1 = sy(y1);
    const gr = g.createLinearGradient(X - w / 2, 0, X + w / 2, 0);
    gr.addColorStop(0, "#1b222c"); gr.addColorStop(0.35, "#2a3340"); gr.addColorStop(1, "#141a22");
    g.fillStyle = gr; g.fillRect(X - w / 2, Y0, w, Y1 - Y0);
    g.fillStyle = "rgba(62,230,255,0.35)"; g.fillRect(X + w * 0.28, Y0, Math.max(1, 0.03 * PX), Y1 - Y0);
    g.fillStyle = "#0f141b"; g.fillRect(X - w / 2 - 0.05 * PX, Y1 - 0.18 * PX, w + 0.1 * PX, 0.18 * PX);
  }

  function drawSolid(g, s) {
    if (!onScreenX(s.x0, s.x1, 4) || sy(s.y1) < -4 || sy(s.y0) > VH + 4) return;
    polyPath(g, s.p);
    const top = sy(s.y0), bot = sy(s.y1);
    const grd = g.createLinearGradient(0, top, 0, bot);
    const [c0, c1] = s.style === "ceil" ? ["#2b333e", "#161b22"] : TH.solid;
    grd.addColorStop(0, c0); grd.addColorStop(1, c1);
    g.fillStyle = grd;
    g.fill();
    g.save();
    g.clip();
    if (TH.edge === "tread") {
      g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = 1;
      for (let x = Math.ceil(s.x0 / 2) * 2; x < s.x1; x += 2) { g.beginPath(); g.moveTo(sx(x), top); g.lineTo(sx(x), bot); g.stroke(); }
    } else if (TH.edge === "cast") {
      // Cast-iron blocks: wide seams, and the face nearest the top warmed by the heat.
      g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = 1;
      for (let x = Math.ceil(s.x0 / 2.5) * 2.5; x < s.x1; x += 2.5) { g.beginPath(); g.moveTo(sx(x), top); g.lineTo(sx(x), bot); g.stroke(); }
      if (s.style !== "ceil") {
        const heat = g.createLinearGradient(0, top, 0, top + 0.7 * PX);
        heat.addColorStop(0, "rgba(255,120,50,0.12)"); heat.addColorStop(1, "rgba(255,120,50,0)");
        g.fillStyle = heat; g.fillRect(sx(s.x0), top, (s.x1 - s.x0) * PX, 0.7 * PX);
      }
    } else {
      g.strokeStyle = "rgba(0,0,0,0.3)"; g.lineWidth = 1;
      for (let x = Math.ceil(s.x0 / 3) * 3; x < s.x1; x += 3) { g.beginPath(); g.moveTo(sx(x), top); g.lineTo(sx(x), bot); g.stroke(); }
      g.fillStyle = "rgba(255,255,255,0.04)"; g.fillRect(sx(s.x0), top, (s.x1 - s.x0) * PX, (s.y1 - s.y0) * PX * 0.35);
    }
    g.restore();
  }

  function drawTopEdges(g) {
    const lw = Math.max(1, 0.035 * PX);
    for (const e of EDGES) {
      if (e.ny > -0.5 || e.style === "ceil" || !onScreenX(e.minx, e.maxx, 2)) continue;
      const len = Math.hypot(e.bx - e.ax, e.by - e.ay), ux = (e.bx - e.ax) / len, uy = (e.by - e.ay) / len;
      if (TH.edge === "tread") {
        // Tread-plate band, highlight lip and rivets.
        const band = 0.16;
        g.fillStyle = "#3a4350";
        g.beginPath();
        g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by));
        g.lineTo(sx(e.bx - e.nx * band), sy(e.by - e.ny * band)); g.lineTo(sx(e.ax - e.nx * band), sy(e.ay - e.ny * band));
        g.closePath(); g.fill();
        g.strokeStyle = "rgba(255,255,255,0.08)"; g.lineWidth = Math.max(1, 0.03 * PX);
        g.beginPath();
        for (let d = 0.1; d < len; d += 0.22) {
          const x = e.ax + ux * d, y = e.ay + uy * d - e.ny * 0.08;
          g.moveTo(sx(x - 0.05), sy(y - 0.03)); g.lineTo(sx(x + 0.05), sy(y + 0.03));
        }
        g.stroke();
        g.strokeStyle = "#7d8899"; g.lineWidth = lw;
        g.beginPath(); g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by)); g.stroke();
        g.fillStyle = "#59636f";
        for (let d = 0.25; d < len; d += 0.5) {
          const x = e.ax + ux * d - e.nx * 0.26, y = e.ay + uy * d - e.ny * 0.26;
          g.beginPath(); g.arc(sx(x), sy(y), Math.max(1, 0.03 * PX), 0, 6.283); g.fill();
        }
      } else if (TH.edge === "cast") {
        // Cast deck: an iron band, a heat-lit lip and bolt heads.
        g.fillStyle = "#4a3c34";
        g.beginPath();
        g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by));
        g.lineTo(sx(e.bx - e.nx * 0.14), sy(e.by - e.ny * 0.14)); g.lineTo(sx(e.ax - e.nx * 0.14), sy(e.ay - e.ny * 0.14));
        g.closePath(); g.fill();
        g.strokeStyle = "#c08a62"; g.lineWidth = lw;
        g.beginPath(); g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by)); g.stroke();
        g.fillStyle = "#6b5549";
        for (let d = 0.3; d < len; d += 0.6) {
          const x = e.ax + ux * d - e.nx * 0.07, y = e.ay + uy * d - e.ny * 0.07;
          g.beginPath(); g.arc(sx(x), sy(y), Math.max(1, 0.035 * PX), 0, 6.283); g.fill();
        }
      } else {
        // Polished deck: a bright lip, a soft sheen, and an LED strip in the face.
        g.fillStyle = "#5d6878";
        g.beginPath();
        g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by));
        g.lineTo(sx(e.bx - e.nx * 0.1), sy(e.by - e.ny * 0.1)); g.lineTo(sx(e.ax - e.nx * 0.1), sy(e.ay - e.ny * 0.1));
        g.closePath(); g.fill();
        g.strokeStyle = "#c3cdda"; g.lineWidth = lw;
        g.beginPath(); g.moveTo(sx(e.ax), sy(e.ay)); g.lineTo(sx(e.bx), sy(e.by)); g.stroke();
        if (len > 1.2) {
          g.strokeStyle = "rgba(62,230,255,0.9)"; g.lineWidth = Math.max(1, 0.035 * PX);
          g.beginPath();
          g.moveTo(sx(e.ax + ux * 0.15 - e.nx * 0.3), sy(e.ay + uy * 0.15 - e.ny * 0.3));
          g.lineTo(sx(e.bx - ux * 0.15 - e.nx * 0.3), sy(e.by - uy * 0.15 - e.ny * 0.3));
          g.stroke();
        }
      }
    }
  }

  function hazardStripes(g, x0, y0, x1, y1) {
    g.save();
    g.beginPath(); g.rect(sx(x0), sy(y0), (x1 - x0) * PX, (y1 - y0) * PX); g.clip();
    g.fillStyle = "#c99a1d"; g.fillRect(sx(x0), sy(y0), (x1 - x0) * PX, (y1 - y0) * PX);
    g.fillStyle = "#14161a";
    const w = 0.18 * PX;
    for (let x = sx(x0) - (y1 - y0) * PX; x < sx(x1); x += w * 2) {
      g.beginPath(); g.moveTo(x, sy(y1)); g.lineTo(x + w, sy(y1)); g.lineTo(x + w + (y1 - y0) * PX, sy(y0)); g.lineTo(x + (y1 - y0) * PX, sy(y0)); g.closePath(); g.fill();
    }
    g.restore();
  }

  function drawDecor(g, d, t) {
    const X = (x) => sx(x), Y = (y) => sy(y);
    if (d.k === "crate") {
      if (!onScreenX(d.x - d.w / 2, d.x + d.w / 2, 4)) return;
      const x0 = X(d.x - d.w / 2), y0 = Y(d.y - d.h), w = d.w * PX, h = d.h * PX;
      g.fillStyle = "#2e3845"; g.fillRect(x0, y0, w, h);
      g.fillStyle = "#3a4656"; g.fillRect(x0, y0, w, 0.08 * PX);
      g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = Math.max(1, 0.03 * PX);
      for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x0 + (w * k) / 4, y0); g.lineTo(x0 + (w * k) / 4, y0 + h); g.stroke(); }
      g.fillStyle = "#c99a1d"; g.fillRect(x0 + w * 0.1, y0 + h * 0.4, w * 0.8, 0.06 * PX);
    } else if (d.k === "machine") {
      if (!onScreenX(d.x - d.w / 2, d.x + d.w / 2, 4)) return;
      const x0 = X(d.x - d.w / 2), y0 = Y(d.y - d.h), w = d.w * PX, h = d.h * PX;
      g.fillStyle = "#1c232d"; g.fillRect(x0, y0, w, h);
      g.fillStyle = "#26303c"; g.fillRect(x0 + w * 0.06, y0 + h * 0.08, w * 0.6, h * 0.5);
      g.fillStyle = "#0d2b35"; g.fillRect(x0 + w * 0.72, y0 + h * 0.12, w * 0.2, h * 0.16);
      g.fillStyle = "rgba(80,220,255,0.75)"; g.fillRect(x0 + w * 0.74, y0 + h * 0.14, w * 0.16 * (0.5 + 0.5 * Math.sin(t * 1.3)), h * 0.04);
      g.fillStyle = "#c99a1d"; g.fillRect(x0, y0 + h * 0.9, w, 0.05 * PX);
    } else if (d.k === "glass") {
      if (!onScreenX(d.x0, d.x1, 4)) return;
      const x0 = X(d.x0), y0 = Y(d.y0), w = (d.x1 - d.x0) * PX, h = (d.y1 - d.y0) * PX;
      const gr = g.createLinearGradient(0, y0, 0, y0 + h);
      gr.addColorStop(0, "#6f8193"); gr.addColorStop(1, "#46566a");
      g.fillStyle = gr; g.fillRect(x0, y0, w, h);
      g.fillStyle = "rgba(200,230,255,0.10)"; g.fillRect(x0, y0 + h * 0.18, w, h * 0.03);
      g.fillStyle = "rgba(20,30,42,0.35)"; g.fillRect(x0, y0 + h * 0.62, w, h * 0.38);
      g.strokeStyle = "rgba(70,90,110,0.5)"; g.lineWidth = Math.max(1, 0.04 * PX);
      for (let x = d.x0 + 2; x < d.x1; x += 2) { g.beginPath(); g.moveTo(X(x), y0); g.lineTo(X(x), y0 + h); g.stroke(); }
    } else if (d.k === "console") {
      if (!onScreenX(d.x - d.w / 2, d.x + d.w / 2, 4)) return;
      const x0 = X(d.x - d.w / 2), y0 = Y(d.y - d.h), w = d.w * PX, h = d.h * PX;
      g.fillStyle = "#3a4654"; g.fillRect(x0, y0, w, h);
      g.fillStyle = "#4b5868"; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + w, y0); g.lineTo(x0 + w * 0.92, y0 - 0.15 * PX); g.lineTo(x0 + w * 0.08, y0 - 0.15 * PX); g.closePath(); g.fill();
      for (let k = 0; k < 5; k++) { g.fillStyle = (k + Math.floor(t * 2)) % 3 ? "#59e3a0" : "#ffb056"; g.fillRect(x0 + w * (0.15 + k * 0.15), y0 + h * 0.25, 0.06 * PX, 0.06 * PX); }
    } else if (d.k === "monitor") {
      if (!onScreenX(d.x - d.w / 2, d.x + d.w / 2, 4)) return;
      const x0 = X(d.x - d.w / 2), y0 = Y(d.y - d.h / 2), w = d.w * PX, h = d.h * PX;
      g.fillStyle = "#10161e"; g.fillRect(x0 - 0.05 * PX, y0 - 0.05 * PX, w + 0.1 * PX, h + 0.1 * PX);
      const gr = g.createLinearGradient(0, y0, 0, y0 + h);
      gr.addColorStop(0, "#1f7d9a"); gr.addColorStop(1, "#0e3a4c");
      g.fillStyle = gr; g.fillRect(x0, y0, w, h);
      g.strokeStyle = "rgba(160,245,255,0.8)"; g.lineWidth = Math.max(1, 0.025 * PX);
      g.beginPath();
      for (let k = 0; k <= 12; k++) { const px = x0 + (w * k) / 12, py = y0 + h * (0.55 + 0.25 * Math.sin(t * 2 + k * 0.9)); k ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.stroke();
      g.fillStyle = "#10161e"; g.fillRect(X(d.x) - 0.04 * PX, y0 + h, 0.08 * PX, 0.4 * PX);
    } else if (d.k === "tank") {
      if (!onScreenX(d.x - d.w / 2, d.x + d.w / 2, 4)) return;
      const x0 = X(d.x - d.w / 2), y0 = Y(d.y - d.h), w = d.w * PX, h = d.h * PX;
      g.fillStyle = "#2a3542"; g.fillRect(x0 - 0.06 * PX, y0, w + 0.12 * PX, 0.18 * PX); g.fillRect(x0 - 0.06 * PX, y0 + h - 0.18 * PX, w + 0.12 * PX, 0.18 * PX);
      const lv = 0.35 + 0.05 * Math.sin(t * 0.8);
      g.fillStyle = "rgba(60,255,170,0.55)"; g.fillRect(x0, y0 + h * lv, w, h * (1 - lv) - 0.18 * PX);
      g.fillStyle = "rgba(200,255,230,0.18)"; g.fillRect(x0, y0 + 0.18 * PX, w, h - 0.36 * PX);
      g.fillStyle = "rgba(255,255,255,0.6)";
      for (let k = 0; k < 4; k++) { const by = mod(t * 0.5 + k * 0.27, 1); g.beginPath(); g.arc(x0 + w * (0.3 + 0.12 * k), y0 + h * (0.95 - by * (0.95 - lv)), 0.03 * PX, 0, 6.283); g.fill(); }
    } else if (d.k === "furnace") {
      if (!onScreenX(d.x - d.w / 2, d.x + d.w / 2, 4)) return;
      const x0 = X(d.x - d.w / 2), y0 = Y(d.y - d.h), w = d.w * PX, h = d.h * PX;
      // Chimney, then a brick body with a tapered shoulder.
      g.fillStyle = "#241915"; g.fillRect(x0 + w * 0.38, y0 - h * 0.7, w * 0.24, h * 0.7);
      g.fillStyle = "#2e211c";
      g.beginPath(); g.moveTo(x0, y0 + h); g.lineTo(x0, y0 + h * 0.28); g.lineTo(x0 + w * 0.2, y0); g.lineTo(x0 + w * 0.8, y0); g.lineTo(x0 + w, y0 + h * 0.28); g.lineTo(x0 + w, y0 + h); g.closePath(); g.fill();
      g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 1;
      g.beginPath();
      for (let yy = y0 + h * 0.3, row = 0; yy < y0 + h; yy += 0.25 * PX, row++) {
        g.moveTo(x0, yy); g.lineTo(x0 + w, yy);
        for (let xx = x0 + (row % 2 ? 0.25 : 0.5) * PX; xx < x0 + w; xx += 0.5 * PX) { g.moveTo(xx, yy); g.lineTo(xx, Math.min(y0 + h, yy + 0.25 * PX)); }
      }
      g.stroke();
      // The mouth: an arch full of fire that flickers.
      const mx = X(d.x), mTop = Y(d.y - d.h * 0.55), mBot = Y(d.y - d.h * 0.12), mw = w * 0.22;
      const f = 0.85 + 0.15 * Math.sin(t * 13 + d.x) * Math.sin(t * 5.1);
      const fire = g.createLinearGradient(0, mTop, 0, mBot);
      fire.addColorStop(0, `rgba(255,120,40,${f})`); fire.addColorStop(0.6, `rgba(255,190,90,${f})`); fire.addColorStop(1, "#fff1c4");
      g.fillStyle = fire;
      g.beginPath(); g.moveTo(mx - mw, mBot); g.lineTo(mx - mw, mTop + mw); g.arc(mx, mTop + mw, mw, Math.PI, 0); g.lineTo(mx + mw, mBot); g.closePath(); g.fill();
      g.fillStyle = "#1a110e"; g.fillRect(mx - mw * 1.3, mBot, mw * 2.6, 0.1 * PX);
    } else if (d.k === "labfloor") {
      if (!onScreenX(d.x0, d.x1, 4)) return;
      g.fillStyle = "#a9b6c3"; g.fillRect(X(d.x0), Y(d.y), (d.x1 - d.x0) * PX, 0.12 * PX);
      g.fillStyle = "rgba(0,0,0,0.18)";
      for (let x = d.x0 + 0.8; x < d.x1; x += 0.8) g.fillRect(X(x), Y(d.y), 1, 0.12 * PX);
    }
  }

  function drawSign(g, S) {
    g.textAlign = "center"; g.textBaseline = "middle";
    if (TH.sign === "hazard") {
      g.font = `600 ${Math.max(8, Math.round(0.2 * PX))}px "IBM Plex Mono", ui-monospace, monospace`;
      const w = (S.text.length * 0.13 + 0.36);
      g.fillStyle = "#1a1f27";
      g.fillRect(sx(S.x) - 0.03 * PX, sy(S.y - 1.3), 0.06 * PX, 1.3 * PX);
      hazardStripes(g, S.x - w / 2, S.y - 1.86, S.x + w / 2, S.y - 1.78);
      g.fillStyle = "#14171c";
      g.fillRect(sx(S.x - w / 2), sy(S.y - 1.78), w * PX, 0.48 * PX);
      g.strokeStyle = "#c99a1d"; g.lineWidth = 1;
      g.strokeRect(sx(S.x - w / 2) + 0.5, sy(S.y - 1.78) + 0.5, w * PX - 1, 0.48 * PX - 1);
      g.fillStyle = "#f0c24a";
      g.fillText(S.text, sx(S.x), sy(S.y - 1.54));
    } else {
      g.font = `700 ${Math.max(8, Math.round(0.24 * PX))}px "Chakra Petch", sans-serif`;
      const w = S.text.length * 0.17 + 0.5, x0 = sx(S.x - w / 2), y0 = sy(S.y - 2.5);
      g.fillStyle = "#0e141c"; g.fillRect(x0, y0, w * PX, 0.5 * PX);
      g.strokeStyle = "rgba(62,230,255,0.8)"; g.lineWidth = 1; g.strokeRect(x0 + 0.5, y0 + 0.5, w * PX - 1, 0.5 * PX - 1);
      g.fillStyle = "#8ff1ff";
      g.fillText(S.text, sx(S.x), sy(S.y - 2.25));
    }
  }

  function drawDock(g, t) {
    if (!dock || !onScreenX(dock.x - 2, dock.x + 2, 4)) return;
    const x = dock.x, f = dock.y;
    // Gantry.
    g.fillStyle = "#56616f";
    g.fillRect(sx(x - 1.05), sy(f - 2.4), 0.14 * PX, 2.4 * PX);
    g.fillRect(sx(x + 0.91), sy(f - 2.4), 0.14 * PX, 2.4 * PX);
    g.fillStyle = "#6c7888"; g.fillRect(sx(x - 1.15), sy(f - 2.55), 2.3 * PX, 0.18 * PX);
    // Cradle on the floor.
    g.fillStyle = "#2a3440";
    g.beginPath(); g.ellipse(sx(x), sy(f), 0.6 * PX, 0.12 * PX, 0, 0, Math.PI); g.fill();
    g.fillStyle = dockDone() ? "#3a4654" : "rgba(80,230,255,0.85)";
    g.fillRect(sx(x - 0.5), sy(f) - 0.03 * PX, PX, 0.05 * PX);
    // Capsule holding the module, and the arms that fit it.
    const cy = f - 1.75;
    g.fillStyle = "rgba(170,230,255,0.16)";
    g.fillRect(sx(x - 0.32), sy(cy - 0.45), 0.64 * PX, 0.9 * PX);
    g.strokeStyle = "rgba(200,240,255,0.6)"; g.lineWidth = Math.max(1, 0.03 * PX);
    g.strokeRect(sx(x - 0.32), sy(cy - 0.45), 0.64 * PX, 0.9 * PX);
    const p = fitT >= 0 ? clamp(fitT / FIT_DUR, 0, 1) : dockDone() ? 1 : 0;
    const drop = p < 0.15 ? 0 : p < 0.5 ? (p - 0.15) / 0.35 : 1;
    if (p < 0.55) (dock.gives === "double" ? drawBooster : drawModule)(g, sx(x), sy(lerp(cy, f - R, drop)), 0.22 * PX, t, 1);
    const reach = fitT >= 0 ? Math.sin(Math.min(1, fitT / FIT_DUR) * Math.PI) : 0;
    g.strokeStyle = "#8b97a6"; g.lineWidth = Math.max(1.5, 0.06 * PX);
    for (const side of [-1, 1]) {
      g.beginPath();
      g.moveTo(sx(x + side * 0.9), sy(f - 2.2));
      g.lineTo(sx(x + side * (0.9 - 0.35 * reach)), sy(f - 1.4 + 0.5 * reach));
      g.lineTo(sx(x + side * (0.55 - 0.2 * reach)), sy(f - 0.9 + 0.4 * reach));
      g.stroke();
    }
  }

  // The spring-gyro module: a coil under a spinning rotor.
  function drawModule(g, X, Y, s, t, alpha) {
    g.save();
    g.globalAlpha = alpha;
    g.strokeStyle = "#cfd8e2"; g.lineWidth = Math.max(1, s * 0.12);
    g.beginPath();
    for (let k = 0; k <= 8; k++) { const yy = Y + s * 0.1 + (k / 8) * s * 0.85, xx = X + (k % 2 ? s * 0.32 : -s * 0.32); k ? g.lineTo(xx, yy) : g.moveTo(X, Y + s * 0.1); }
    g.stroke();
    g.fillStyle = "#3a4654"; g.fillRect(X - s * 0.45, Y + s * 0.92, s * 0.9, s * 0.16);
    const spin = Math.abs(Math.cos(t * 30));
    g.strokeStyle = "rgba(80,230,255,0.95)"; g.lineWidth = Math.max(1, s * 0.1);
    g.beginPath(); g.ellipse(X, Y - s * 0.2, s * 0.6 * Math.max(0.12, spin), s * 0.6, 0, 0, 6.283); g.stroke();
    g.fillStyle = "#e8f6ff"; g.beginPath(); g.arc(X, Y - s * 0.2, s * 0.16, 0, 6.283); g.fill();
    g.restore();
  }

  // The thruster module: a gas canister on a collar with two nozzles and pilot flames.
  function drawBooster(g, X, Y, s, t, alpha) {
    g.save();
    g.globalAlpha = alpha;
    g.strokeStyle = "#cfd8e2"; g.lineWidth = Math.max(1, s * 0.14);
    g.beginPath(); g.arc(X, Y + s * 0.1, s * 0.6, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    for (const side of [-1, 1]) {
      const nx = X + side * s * 0.52, ny = Y + s * 0.3;
      g.fillStyle = "#56616f";
      g.beginPath(); g.moveTo(nx - s * 0.15, ny - s * 0.25); g.lineTo(nx + s * 0.15, ny - s * 0.25); g.lineTo(nx + s * 0.22, ny + s * 0.25); g.lineTo(nx - s * 0.22, ny + s * 0.25); g.closePath(); g.fill();
      const f = 0.6 + 0.4 * Math.abs(Math.sin(t * 17 + side));
      g.fillStyle = `rgba(110,240,255,${0.85 * f})`;
      g.beginPath(); g.arc(nx, ny + s * 0.36, s * 0.1 * f + 1, 0, 6.283); g.fill();
    }
    g.fillStyle = "#e8f6ff"; g.fillRect(X - s * 0.15, Y - s * 0.35, s * 0.3, s * 0.62);
    g.fillStyle = "#3ee6ff"; g.fillRect(X - s * 0.15, Y - s * 0.08, s * 0.3, s * 0.09);
    g.restore();
  }

  function drawLift(g, l) {
    const sh = l.shaft;
    if (!onScreenX(sh.x0 - 1, sh.x1 + 1, 4)) return;
    g.fillStyle = "#151a22";
    g.fillRect(sx(sh.x0), sy(sh.top), 0.12 * PX, (sh.bottom - sh.top) * PX);
    g.fillRect(sx(sh.x1 - 0.12), sy(sh.top), 0.12 * PX, (sh.bottom - sh.top) * PX);
    g.strokeStyle = "#1c222b"; g.lineWidth = 1;
    g.beginPath(); for (let y = sh.top + 0.4; y < sh.bottom - 0.05; y += 0.6) { g.moveTo(sx(sh.x0 + 0.1), sy(y)); g.lineTo(sx(sh.x1 - 0.1), sy(y + 0.6)); } g.stroke();
  }
  function drawLiftCar(g, l) {
    if (!onScreenX(l.x0 - 1, l.x1 + 1, 4)) return;
    const ly = l.y, mid = (l.x0 + l.x1) / 2;
    g.fillStyle = TH.edge === "tread" ? "#39414d" : "#56616f";
    g.fillRect(sx(l.x0), sy(ly), (l.x1 - l.x0) * PX, 0.3 * PX);
    hazardStripes(g, l.x0, ly, l.x1, ly + 0.1);
    g.strokeStyle = TH.edge === "tread" ? "#2a313b" : "#6c7888"; g.lineWidth = Math.max(1, 0.04 * PX);
    g.beginPath();
    g.moveTo(sx(l.x0 + 0.05), sy(ly)); g.lineTo(sx(l.x0 + 0.05), sy(ly - 2.2));
    g.lineTo(sx(l.x1 - 0.05), sy(ly - 2.2)); g.lineTo(sx(l.x1 - 0.05), sy(ly));
    g.stroke();
    g.fillStyle = g.strokeStyle;
    g.fillRect(sx(mid - 0.6), sy(ly - 2.35), 1.2 * PX, 0.15 * PX);
    for (const gt of l.gates) if (!(gt.openAt === "top" ? atTop(l) : atBottom(l))) hazardStripes(g, ...gt.r);
  }

  function drawWorld(t) {
    const g = wctx;
    g.clearRect(0, 0, VW, VH);

    for (const c of LV.columns || []) if (Math.abs(c[0] - camX) * PX < VW) drawColumn(g, c[0], c[1]);
    for (const c of LV.pillars || []) if (Math.abs(c[0] - camX) * PX < VW) drawPillar(g, c[0], c[1], c[2]);
    for (const d of LV.decor || []) if (d.k !== "labfloor") drawDecor(g, d, t);
    for (const l of lifts) drawLift(g, l);

    // Lamp posts, hanging lamps and ceiling tubes.
    for (const L of LV.lamps || []) {
      if (!onScreenX(L.x - 1, L.x + 1, 4)) continue;
      const X = sx(L.x), top = sy(L.y - L.h);
      g.fillStyle = "#1a1f27";
      g.fillRect(X - 0.05 * PX, top, 0.1 * PX, L.h * PX);
      g.fillRect(X, top, 0.7 * PX, 0.07 * PX);
      g.fillStyle = "#2a2f38";
      g.fillRect(X + 0.4 * PX, top + 0.05 * PX, 0.36 * PX, 0.12 * PX);
    }
    for (const L of LV.hanging || []) {
      if (!onScreenX(L.x - 1, L.x + 1, 4)) continue;
      g.strokeStyle = "#1a1f27"; g.lineWidth = Math.max(1, 0.03 * PX);
      g.beginPath(); g.moveTo(sx(L.x), sy(L.y)); g.lineTo(sx(L.x), sy(L.y + L.len)); g.stroke();
      g.fillStyle = "#262c35";
      g.beginPath(); g.moveTo(sx(L.x - 0.1), sy(L.y + L.len)); g.lineTo(sx(L.x + 0.1), sy(L.y + L.len));
      g.lineTo(sx(L.x + 0.3), sy(L.y + L.len + 0.22)); g.lineTo(sx(L.x - 0.3), sy(L.y + L.len + 0.22)); g.closePath(); g.fill();
    }
    for (const L of LV.tubes || []) {
      if (!onScreenX(L.x - 1, L.x + 1, 4)) continue;
      g.fillStyle = "#2a3340"; g.fillRect(sx(L.x - 0.85), sy(L.y), 1.7 * PX, 0.14 * PX);
      g.fillStyle = "#f3f8ff"; g.fillRect(sx(L.x - 0.75), sy(L.y + 0.14), 1.5 * PX, Math.max(2, 0.06 * PX));
    }

    for (const S of LV.signs || []) if (onScreenX(S.x - 2, S.x + 2, 4)) drawSign(g, S);

    // Checkpoint posts.
    CHECKPOINTS.forEach((c, i) => {
      if (i === 0 || !onScreenX(c.x - 1, c.x + 1, 4)) return;
      g.fillStyle = "#1a1f27";
      g.fillRect(sx(c.x + 0.6) - 0.04 * PX, sy(c.y - 1.1), 0.08 * PX, 1.1 * PX);
      g.fillStyle = i <= cpIndex ? "#7dff9a" : "#2b3a30";
      g.beginPath(); g.arc(sx(c.x + 0.6), sy(c.y - 1.15), 0.09 * PX, 0, 6.283); g.fill();
    });

    // Exit gate.
    const ex = LV.exit;
    if (onScreenX(ex.x0 - 1, ex.x0 + 3, 4)) {
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillStyle = "#10141a";
      g.fillRect(sx(ex.x0), sy(ex.floor - 3.4), 2.2 * PX, 3.4 * PX);
      g.fillStyle = "#0a1a10";
      g.fillRect(sx(ex.x0 + 0.3), sy(ex.floor - 3.1), 1.6 * PX, 3.1 * PX);
      g.fillStyle = "#5dff8f";
      g.font = `700 ${Math.round(0.3 * PX)}px "Chakra Petch", sans-serif`;
      g.fillText("EXIT", sx(ex.x0 + 1.1), sy(ex.floor - 3.75));
    }

    drawDock(g, t);

    for (const s of SOLIDS) drawSolid(g, s);
    drawTopEdges(g);
    for (const d of LV.decor || []) if (d.k === "labfloor") drawDecor(g, d, t);
    for (const st of LV.stripes || []) if (onScreenX(st[0], st[2], 4)) hazardStripes(g, ...st);

    // Steam vent grates: they glow and hiss just before the plume comes.
    for (const v of vents) {
      if (!onScreenX(v.x0 - 1, v.x1 + 1, 4)) continue;
      const on = ventOn(v, t), warn = ventWarn(v, t);
      g.fillStyle = "#1a1210"; g.fillRect(sx(v.x0), sy(v.y) - 0.06 * PX, (v.x1 - v.x0) * PX, 0.14 * PX);
      g.fillStyle = on ? "#ffb066" : warn && Math.sin(t * 40) > 0 ? "#a85a26" : "#3a2a22";
      for (let x = v.x0 + 0.12; x < v.x1 - 0.1; x += 0.3) g.fillRect(sx(x), sy(v.y) - 0.04 * PX, 0.13 * PX, 0.09 * PX);
    }
    // Conveyor belts with moving chevrons.
    for (const cv of conveyors) {
      if (!onScreenX(cv.x0, cv.x1, 4)) continue;
      g.fillStyle = "#151a20"; g.fillRect(sx(cv.x0), sy(cv.y) - 0.02 * PX, (cv.x1 - cv.x0) * PX, 0.2 * PX);
      g.save();
      g.beginPath(); g.rect(sx(cv.x0), sy(cv.y) - 0.02 * PX, (cv.x1 - cv.x0) * PX, 0.2 * PX); g.clip();
      g.strokeStyle = "#f3b13c"; g.lineWidth = Math.max(1, 0.04 * PX);
      const dir = Math.sign(cv.v), off = mod(t * cv.v, 0.6);
      g.beginPath();
      for (let x = cv.x0 - 0.6 + off; x < cv.x1 + 0.6; x += 0.6) {
        g.moveTo(sx(x - dir * 0.08), sy(cv.y + 0.02)); g.lineTo(sx(x + dir * 0.08), sy(cv.y + 0.08)); g.lineTo(sx(x - dir * 0.08), sy(cv.y + 0.14));
      }
      g.stroke();
      g.restore();
      g.fillStyle = "#2a3340";
      for (const x of [cv.x0 + 0.12, cv.x1 - 0.12]) { g.beginPath(); g.arc(sx(x), sy(cv.y + 0.08), 0.1 * PX, 0, 6.283); g.fill(); }
    }

    // Electrified plates.
    for (const z of zaps) {
      if (!onScreenX(z.x0, z.x1, 4)) continue;
      const on = zapOn(z, t), warn = zapWarn(z, t);
      g.fillStyle = on ? "#9fdcff" : warn ? "#3c5566" : "#20303b";
      g.fillRect(sx(z.x0), sy(z.y) - 0.05 * PX, (z.x1 - z.x0) * PX, 0.12 * PX);
      g.fillStyle = "#0b0f14";
      for (let x = z.x0 + 0.2; x < z.x1; x += 0.4) g.fillRect(sx(x), sy(z.y) - 0.05 * PX, 0.05 * PX, 0.12 * PX);
    }

    // Doors, their pressure plates and countdown lamps.
    for (const d of doors) {
      if (d.plate && onScreenX(d.plate.x0 - 1, d.x1 + 1, 4)) {
        const pl = d.plate;
        g.fillStyle = d.pressed ? "#c99a1d" : "#7a6420";
        g.fillRect(sx(pl.x0), sy(pl.y) - (d.pressed ? 0.02 : 0.08) * PX, (pl.x1 - pl.x0) * PX, 0.1 * PX);
        const n = 8, lit = Math.ceil((d.timer / d.hold) * n);
        for (let i = 0; i < n; i++) {
          const x = lerp(pl.x1 + 0.4, d.x0 - 0.4, i / (n - 1));
          g.fillStyle = i < lit ? "#ffcf6b" : "#2b2a24";
          g.beginPath(); g.arc(sx(x), sy(pl.y + 0.35), 0.06 * PX, 0, 6.283); g.fill();
        }
      }
      if (!onScreenX(d.x0 - 1, d.x1 + 1, 4)) continue;
      if (d.style === "glass") {
        g.fillStyle = "rgba(170,225,255,0.22)";
        g.fillRect(sx(d.x0), sy(d.top), (d.x1 - d.x0) * PX, (d.bottom - d.top) * PX);
        g.fillStyle = "rgba(62,230,255,0.85)";
        g.fillRect(sx(d.x0), sy(d.bottom) - 0.06 * PX, (d.x1 - d.x0) * PX, 0.06 * PX);
        g.fillStyle = "rgba(255,255,255,0.35)";
        g.fillRect(sx(d.x0) + 1, sy(d.top), Math.max(1, 0.03 * PX), (d.bottom - d.top) * PX);
      } else {
        g.fillStyle = "#2b323d";
        g.fillRect(sx(d.x0), sy(d.top), (d.x1 - d.x0) * PX, (d.bottom - d.top) * PX);
        hazardStripes(g, d.x0, d.bottom - 0.25, d.x1, d.bottom);
      }
      const locked = doorLocked(d);
      g.fillStyle = locked ? "#ff3b30" : d.timer > 0 ? "#7dff9a" : d.sensor ? "#5fd7ff" : "#ff3b30";
      g.beginPath(); g.arc(sx(d.light[0]), sy(d.light[1]), 0.07 * PX, 0, 6.283); g.fill();
    }

    // Presses.
    for (const c of crushers) {
      if (!onScreenX(c.x0 - 1, c.x1 + 1, 4)) continue;
      const mid = (c.x0 + c.x1) / 2;
      if (TH.edge === "cast") {
        // Forge hammer: a heavy ram with a red-hot face.
        g.fillStyle = "#2a201b";
        g.fillRect(sx(mid - 0.16), sy(c.top), 0.32 * PX, (c.bottom - 0.6 - c.top) * PX);
        g.fillStyle = "#4a3a31";
        g.fillRect(sx(c.x0 - 0.08), sy(c.bottom - 0.6), (c.x1 - c.x0 + 0.16) * PX, 0.3 * PX);
        g.fillRect(sx(c.x0), sy(c.bottom - 0.3), (c.x1 - c.x0) * PX, 0.3 * PX);
        hazardStripes(g, c.x0 - 0.08, c.bottom - 0.6, c.x1 + 0.08, c.bottom - 0.5);
        const hot = g.createLinearGradient(0, sy(c.bottom - 0.16), 0, sy(c.bottom));
        hot.addColorStop(0, "#7a2a12"); hot.addColorStop(1, crusherWarn(c, t) ? "#ffd27a" : "#ff8a3a");
        g.fillStyle = hot; g.fillRect(sx(c.x0), sy(c.bottom - 0.16), (c.x1 - c.x0) * PX, 0.16 * PX);
        continue;
      }
      g.fillStyle = TH.edge === "tread" ? "#1a1f27" : "#3a4552";
      g.fillRect(sx(mid - 0.12), sy(c.top), 0.24 * PX, (c.bottom - 0.5 - c.top) * PX);
      g.fillStyle = TH.edge === "tread" ? "#343c48" : "#5a6676";
      g.fillRect(sx(c.x0), sy(c.bottom - 0.5), (c.x1 - c.x0) * PX, 0.5 * PX);
      hazardStripes(g, c.x0, c.bottom - 0.14, c.x1, c.bottom);
    }

    for (const l of lifts) drawLiftCar(g, l);

    // Crane: overhead rail, trolley, a hook block with a work lamp, and the slung pallet.
    for (const m of movers) {
      if (!onScreenX(m.xa - 1, m.xb + m.w + 1, 4)) continue;
      g.fillStyle = "#1d1512";
      g.fillRect(sx(m.xa - 0.6), sy(m.rail) - 0.12 * PX, (m.xb + m.w - m.xa + 1.2) * PX, 0.24 * PX);
      const cx = m.x + m.w / 2, hook = m.y - 1.9;
      g.fillStyle = "#3a2e28"; g.fillRect(sx(cx - 0.5), sy(m.rail) + 0.12 * PX, PX, 0.34 * PX);
      g.fillStyle = "#14100e";
      for (const wx of [cx - 0.3, cx + 0.3]) { g.beginPath(); g.arc(sx(wx), sy(m.rail) + 0.08 * PX, 0.1 * PX, 0, 6.283); g.fill(); }
      g.strokeStyle = "#2a201b"; g.lineWidth = Math.max(1, 0.04 * PX);
      g.beginPath();
      g.moveTo(sx(cx), sy(m.rail + 0.46)); g.lineTo(sx(cx), sy(hook));
      g.moveTo(sx(cx), sy(hook)); g.lineTo(sx(m.x + 0.12), sy(m.y));
      g.moveTo(sx(cx), sy(hook)); g.lineTo(sx(m.x + m.w - 0.12), sy(m.y));
      g.stroke();
      g.fillStyle = "#c99a1d"; g.fillRect(sx(cx - 0.16), sy(hook - 0.3), 0.32 * PX, 0.3 * PX);
      g.fillStyle = "#4b3d35"; g.fillRect(sx(m.x), sy(m.y), m.w * PX, 0.3 * PX);
      g.fillStyle = "#c08a62"; g.fillRect(sx(m.x), sy(m.y), m.w * PX, Math.max(1, 0.035 * PX));
      hazardStripes(g, m.x, m.y + 0.18, m.x + m.w, m.y + 0.3);
    }

    // Beacons.
    for (const b of LV.beacons || []) {
      if (!onScreenX(b.x - 1, b.x + 1, 4)) continue;
      g.fillStyle = "#1a1f27";
      g.fillRect(sx(b.x) - 0.06 * PX, sy(b.y) - 0.16 * PX, 0.12 * PX, 0.16 * PX);
      g.fillStyle = Math.sin(t * 6 + b.x) > 0 ? "#ffa21a" : "#4a3210";
      g.beginPath(); g.arc(sx(b.x), sy(b.y - 0.2), 0.07 * PX, 0, 6.283); g.fill();
    }

    // Laser emitters (beams are drawn as light, later).
    for (const l of lasers) {
      if (!onScreenX(l.x - 1, l.x + 1, 4)) continue;
      g.fillStyle = "#2a3340";
      g.fillRect(sx(l.x - 0.16), sy(l.y1) - 0.12 * PX, 0.32 * PX, 0.12 * PX);
      g.fillRect(sx(l.x - 0.16), sy(l.y0), 0.32 * PX, 0.12 * PX);
      if (l.y1 - l.y0 < 1) g.fillRect(sx(l.x - 0.04), sy(l.y0), 0.08 * PX, (l.y1 - l.y0) * PX * 0.15);
      g.fillStyle = laserOn(l, t) ? "#ff3b4e" : laserWarn(l, t) ? "#7a2430" : "#3a1c22";
      g.fillRect(sx(l.x - 0.06), sy(l.y1) - 0.1 * PX, 0.12 * PX, 0.04 * PX);
    }

    drawBall(g, t);
    drawParticles(g, false);
  }

  function drawBall(g, t) {
    if (!ball.alive) return;
    const X = sx(ball.x), Y = sy(ball.y);
    const pop = ball.spawnT > 0 ? 1 - ball.spawnT / 0.6 : 1;
    const r = R * PX * (0.6 + 0.4 * pop);
    g.save();
    g.globalAlpha = clamp(pop * 1.2, 0, 1);
    if (ball.grounded) {
      g.fillStyle = "rgba(0,0,0,0.5)";
      g.beginPath(); g.ellipse(X, Y + r * 0.95, r * 0.9, r * 0.18, 0, 0, 6.283); g.fill();
    }
    // The spring kicking out of the bottom on a jump.
    if (springFx && springFx.t < 0.22) {
      const gy = sy(springFx.y), top = Y + r * 0.55;
      if (gy > top) {
        const k = 1 - springFx.t / 0.22;
        g.strokeStyle = `rgba(215,225,235,${0.5 + 0.5 * k})`; g.lineWidth = Math.max(1.2, r * 0.12);
        g.beginPath(); g.moveTo(X, top);
        const n = 7;
        for (let i = 1; i <= n; i++) g.lineTo(X + (i % 2 ? r * 0.22 : -r * 0.22), top + ((gy - top) * i) / n);
        g.stroke();
        g.fillStyle = "#56616f"; g.fillRect(X - r * 0.3, gy - r * 0.08, r * 0.6, r * 0.12);
      }
    }
    const body = g.createRadialGradient(X - r * 0.35, Y - r * 0.4, r * 0.05, X, Y, r);
    body.addColorStop(0, "#f06a5f");
    body.addColorStop(0.35, "#c3242c");
    body.addColorStop(0.8, "#6e0f17");
    body.addColorStop(1, "#2a0609");
    g.fillStyle = body;
    g.beginPath(); g.arc(X, Y, r, 0, 6.283); g.fill();

    const fitting = fitT >= 0, p = fitting ? clamp(fitT / FIT_DUR, 0, 1) : 1;
    if (!hasJump && !fitting) {
      // Plain ball: seam, turning bolts and a hub light.
      g.strokeStyle = "rgba(0,0,0,0.5)"; g.lineWidth = Math.max(1, r * 0.06);
      g.beginPath(); g.arc(X, Y, r * 0.68, 0, 6.283); g.stroke();
      g.strokeStyle = "rgba(255,200,190,0.18)"; g.lineWidth = 1;
      g.beginPath(); g.arc(X, Y, r * 0.72, -2.2, -0.8); g.stroke();
      for (let i = 0; i < 4; i++) {
        const a = ball.angle + i * Math.PI / 2;
        g.fillStyle = "rgba(210,210,215,0.75)";
        g.beginPath(); g.arc(X + Math.cos(a) * r * 0.84, Y + Math.sin(a) * r * 0.84, Math.max(1, r * 0.07), 0, 6.283); g.fill();
      }
      g.fillStyle = "#1c2027";
      g.beginPath(); g.arc(X, Y, r * 0.3, 0, 6.283); g.fill();
    } else {
      // Fitted ball: the tread ring turns, the side cap stays level on its gyro.
      const split = !fitting ? 0 : p < 0.1 ? 0 : p < 0.35 ? (p - 0.1) / 0.25 : p < 0.75 ? 1 : p < 0.9 ? 1 - (p - 0.75) / 0.15 : 0;
      g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = Math.max(1, r * 0.05);
      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = ball.angle + i * 0.6283;
        g.moveTo(X + Math.cos(a) * r * 0.78, Y + Math.sin(a) * r * 0.78); g.lineTo(X + Math.cos(a) * r * 0.97, Y + Math.sin(a) * r * 0.97);
      }
      g.stroke();
      g.fillStyle = "#16060a";
      g.beginPath(); g.arc(X, Y, r * 0.72, 0, 6.283); g.fill();
      if (split > 0) {
        g.fillStyle = `rgba(80,230,255,${0.35 * split})`;
        g.beginPath(); g.arc(X, Y, r * 0.72, 0, 6.283); g.fill();
        if (p > 0.45) (dock && dock.gives === "double" ? drawBooster : drawModule)(g, X, Y + r * 0.05, r * 0.42, t, clamp((p - 0.45) * 5, 0, 1) * split);
      }
      const capR = r * (0.64 - 0.2 * split);
      const cap = g.createRadialGradient(X - capR * 0.3, Y - capR * 0.35, capR * 0.05, X, Y, capR);
      cap.addColorStop(0, "#ff8f84"); cap.addColorStop(0.5, "#d6363d"); cap.addColorStop(1, "#7c1219");
      g.globalAlpha = clamp(pop * 1.2, 0, 1) * (1 - 0.65 * split);
      g.fillStyle = cap;
      g.beginPath(); g.arc(X, Y, capR, 0, 6.283); g.fill();
      g.strokeStyle = "rgba(255,220,210,0.35)"; g.lineWidth = 1;
      g.beginPath(); g.arc(X, Y, capR, -2.4, -0.7); g.stroke();
      // Gyro window with a spinning rotor.
      g.fillStyle = "#0e1a22";
      g.beginPath(); g.arc(X, Y - capR * 0.12, capR * 0.42, 0, 6.283); g.fill();
      const spin = Math.max(0.15, Math.abs(Math.cos(t * 26)));
      g.strokeStyle = "rgba(120,235,255,0.95)"; g.lineWidth = Math.max(1, r * 0.06);
      g.beginPath(); g.ellipse(X, Y - capR * 0.12, capR * 0.32 * spin, capR * 0.32, 0, 0, 6.283); g.stroke();
      // Spring housing at the bottom, with a ready light.
      g.fillStyle = "#2a0d12";
      g.fillRect(X - capR * 0.22, Y + capR * 0.4, capR * 0.44, capR * 0.5);
      g.strokeStyle = "rgba(220,225,235,0.8)"; g.lineWidth = Math.max(1, r * 0.04);
      g.beginPath();
      for (let k = 0; k <= 4; k++) { const yy = Y + capR * (0.45 + k * 0.1); g.moveTo(X - capR * 0.16, yy); g.lineTo(X + capR * 0.16, yy + capR * 0.05); }
      g.stroke();
      g.globalAlpha = clamp(pop * 1.2, 0, 1);
      g.fillStyle = jumpCool > 0 ? "#ffa21a" : "#7dff9a";
      g.beginPath(); g.arc(X + capR * 0.38, Y + capR * 0.62, Math.max(1, r * 0.06), 0, 6.283); g.fill();
      // Thruster nozzles on the level part, lit while the mid-air kick is ready.
      if (hasDouble) {
        for (const side of [-1, 1]) {
          const a = Math.PI / 2 + side * 0.8, px = X + Math.cos(a) * r * 0.84, py = Y + Math.sin(a) * r * 0.84;
          g.fillStyle = "#56616f";
          g.beginPath(); g.arc(px, py, Math.max(1.5, r * 0.15), 0, 6.283); g.fill();
          g.fillStyle = boosts > 0 ? "#6ef0ff" : "#24414a";
          g.beginPath(); g.arc(px, py, Math.max(1, r * 0.08), 0, 6.283); g.fill();
        }
      }
    }
    const danger = dangerNow;
    g.fillStyle = danger === 2 ? "#ff3b30" : danger === 1 ? "#ffa21a" : "#7dff9a";
    g.beginPath(); g.arc(X, Y - (hasJump || fitting ? r * 0.08 : 0), r * 0.11, 0, 6.283); g.fill();
    g.fillStyle = "rgba(255,255,255,0.45)";
    g.beginPath(); g.ellipse(X - r * 0.38, Y - r * 0.45, r * 0.2, r * 0.11, -0.7, 0, 6.283); g.fill();
    g.restore();
  }

  function drawParticles(g, additive) {
    for (const p of particles) {
      if ((p.kind !== "shard") !== additive) continue;
      if (p.kind === "ember") {
        const a = clamp(p.life, 0, 1), s = Math.max(1.5, 0.045 * PX);
        g.fillStyle = `rgba(255,${150 + Math.round(70 * a)},70,${a})`;
        g.fillRect(sx(p.x) - s / 2, sy(p.y) - s / 2, s, s);
      } else if (p.kind === "shard") {
        g.save();
        g.translate(sx(p.x), sy(p.y)); g.rotate(p.rot);
        g.fillStyle = `rgba(190,40,45,${clamp(p.life, 0, 1)})`;
        const s = p.size * PX;
        g.beginPath(); g.moveTo(-s, -s * 0.6); g.lineTo(s, 0); g.lineTo(-s * 0.4, s * 0.8); g.closePath(); g.fill();
        g.restore();
      } else {
        const a = clamp(p.life * 2, 0, 1);
        g.strokeStyle = p.tint === "blue" ? `rgba(160,220,255,${a})` : p.tint === "red" ? `rgba(255,90,100,${a})` : p.tint === "cyan" ? `rgba(110,240,255,${a})` : `rgba(255,190,90,${a})`;
        g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(sx(p.x), sy(p.y)); g.lineTo(sx(p.x - p.vx * 0.03), sy(p.y - p.vy * 0.03)); g.stroke();
      }
    }
  }

  const AMBER = [255, 176, 86], COOL = [205, 225, 255], TUBE = [215, 232, 255], HOT = [255, 112, 40];
  function lights(t) {
    const out = [];
    for (const L of LV.lamps || []) {
      let i = 0.95;
      if (L.flicker) { const f = Math.sin(t * 23) * Math.sin(t * 7.3 + 1) * Math.sin(t * 1.7); if (f > 0.35) i = 0.25; }
      out.push({ x: L.x + 0.58, y: L.y - L.h + 0.2, r: 5.5, i, c: AMBER, cone: L.y });
    }
    for (const L of LV.hanging || []) out.push({ x: L.x, y: L.y + L.len + 0.25, r: 4.6, i: 0.9, c: L.warm ? AMBER : COOL, cone: L.y + L.len + 3.4 });
    for (const m of melts) for (let x = m.x0 + 0.8; x < m.x1; x += 2.4) out.push({ x, y: m.y - 0.15, r: 3.4, i: 0.85, c: HOT, noBulb: true });
    for (const v of vents) if (ventOn(v, t)) out.push({ x: (v.x0 + v.x1) / 2, y: v.y - 0.4, r: 2.6, i: 0.5, c: [255, 196, 140], noBulb: true });
    for (const m of movers) out.push({ x: m.x + m.w / 2, y: m.y - 1.75, r: 3.4, i: 0.8, c: AMBER, cone: m.y });
    for (const d of LV.decor || []) if (d.k === "furnace") out.push({ x: d.x, y: d.y - d.h * 0.3, r: 4.2, i: 0.8 + 0.15 * Math.sin(t * 13 + d.x) * Math.sin(t * 5.1), c: HOT, noBulb: true });
    if (TH.edge === "cast") for (const c of crushers) out.push({ x: (c.x0 + c.x1) / 2, y: c.bottom - 0.05, r: 1.8, i: 0.6, c: HOT, noBulb: true });
    for (const L of LV.tubes || []) out.push({ x: L.x, y: L.y + 0.3, r: L.r || 6.2, i: L.i || 0.9, c: TUBE, cone: L.f, wide: true });
    for (const b of LV.beacons || []) if (Math.sin(t * 6 + b.x) > 0) out.push({ x: b.x, y: b.y - 0.2, r: 2.2, i: 0.6, c: [255, 162, 26] });
    for (const z of zaps) if (zapOn(z, t)) out.push({ x: (z.x0 + z.x1) / 2, y: z.y - 0.2, r: 3.5, i: 0.85, c: [140, 210, 255] });
    for (const l of lasers) if (laserOn(l, t)) out.push({ x: l.x, y: (l.y0 + l.y1) / 2, r: 1.4 + (l.y1 - l.y0) * 0.3, i: 0.7, c: [255, 50, 70], noBulb: true });
    for (const l of lifts) out.push({ x: (l.x0 + l.x1) / 2, y: l.y - 2.1, r: 3, i: 0.7, c: COOL });
    for (const c of crushers) if (crusherWarn(c, t)) out.push({ x: (c.x0 + c.x1) / 2, y: c.top + 0.3, r: 2.4, i: 0.8, c: [255, 60, 48] });
    for (const d of doors) out.push({ x: d.light[0], y: d.light[1], r: 1.6, i: 0.6, c: doorLocked(d) ? [255, 59, 48] : d.timer > 0 ? [125, 255, 154] : d.sensor ? [95, 215, 255] : [255, 59, 48] });
    for (const m of LV.decor || []) if (m.k === "monitor") out.push({ x: m.x, y: m.y, r: 2.2, i: 0.55, c: [90, 220, 255], noBulb: true });
    if (dock) out.push({ x: dock.x, y: dock.y - 1.75, r: 2.8, i: dockDone() ? 0.35 : 0.9, c: [80, 230, 255] });
    CHECKPOINTS.forEach((c, i) => { if (i > 0 && i <= cpIndex) out.push({ x: c.x + 0.6, y: c.y - 1.15, r: 1.8, i: 0.6, c: [125, 255, 154] }); });
    out.push({ x: LV.exit.x0 + 1.1, y: LV.exit.floor - 3.7, r: 4.5, i: 0.9, c: [93, 255, 143] });
    if (ball.alive) out.push({ x: ball.x, y: ball.y, r: 1.5, i: 0.55, c: [255, 120, 110], noBulb: true });
    return out.filter((L) => Math.abs(sx(L.x) - VW / 2) < VW / 2 + L.r * PX && Math.abs(sy(L.y) - VH / 2) < VH / 2 + L.r * PX + (L.cone !== undefined ? (L.cone - L.y) * PX : 0));
  }

  function applyLighting(list) {
    const g = lctx;
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, VW, VH);
    g.fillStyle = `rgba(0,0,0,${TH.dark})`;
    g.fillRect(0, 0, VW, VH);
    g.globalCompositeOperation = "destination-out";
    const hole = radialSprite("hole", [[0, "#000"], [0.45, "rgba(0,0,0,0.45)"], [1, "rgba(0,0,0,0)"]]);
    for (const L of list) {
      const X = sx(L.x), Y = sy(L.y), r = L.r * PX;
      g.globalAlpha = L.i;
      g.drawImage(hole, X - r, Y - r, r * 2, r * 2);
    }
    g.globalAlpha = 1;
    wctx.globalCompositeOperation = "source-atop";
    wctx.drawImage(lcv, 0, 0, VW, VH);
    wctx.globalCompositeOperation = "source-over";
  }

  // Radial falloffs are drawn once into small sprites and then scaled, instead of building gradients every frame.
  const spriteCache = new Map();
  function radialSprite(key, stops) {
    let c = spriteCache.get(key);
    if (c) return c;
    c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    for (const [o, col] of stops) gr.addColorStop(o, col);
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    spriteCache.set(key, c);
    return c;
  }
  const tintSprite = ([r, g, b]) => radialSprite(`t${r},${g},${b}`, [[0, `rgb(${r},${g},${b})`], [1, `rgba(${r},${g},${b},0)`]]);
  const bulbSprite = ([r, g, b]) => radialSprite(`b${r},${g},${b}`, [[0, "rgba(255,255,255,0.9)"], [0.3, `rgba(${r},${g},${b},0.6)`], [1, `rgba(${r},${g},${b},0)`]]);

  // Soft light (tints, cones and the bloom) is soft anyway, so it is gathered in the half-res layer
  // and added to the screen in a single pass.
  function drawSoftLight(list) {
    const g = gctx;
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, VW, VH);
    g.globalCompositeOperation = "lighter";
    for (const L of list) {
      const [r, gg, b] = L.c;
      const X = sx(L.x), Y = sy(L.y), rad = L.r * PX;
      g.globalAlpha = TH.glow * L.i;
      g.drawImage(tintSprite(L.c), X - rad, Y - rad, rad * 2, rad * 2);
      g.globalAlpha = 1;
      if (L.cone !== undefined) {
        const top = Y, bot = sy(L.cone), w0 = (L.wide ? 0.7 : 0.25) * PX, w1 = (L.wide ? 2.4 : 1.6) * PX;
        const cg = g.createLinearGradient(0, top, 0, bot);
        cg.addColorStop(0, `rgba(${r},${gg},${b},${0.12 * L.i})`);
        cg.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        g.fillStyle = cg;
        g.beginPath(); g.moveTo(X - w0, top); g.lineTo(X + w0, top); g.lineTo(X + w1, bot); g.lineTo(X - w1, bot); g.closePath(); g.fill();
      }
    }
    drawSteam(g, time);
    if (bloomOn && sampleBloom()) { g.globalAlpha = 0.8; g.drawImage(bl1, 0, 0, VW, VH); g.globalAlpha = 1; }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(gcv, 0, 0, VW, VH);
    ctx.restore();
  }

  // Small, sharp light: bulbs, arcs, beams and sparks, at full resolution.
  function drawBright(list) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const L of list) {
      if (L.noBulb) continue;
      ctx.globalAlpha = L.i;
      ctx.drawImage(bulbSprite(L.c), sx(L.x) - 0.35 * PX, sy(L.y) - 0.35 * PX, 0.7 * PX, 0.7 * PX);
    }
    ctx.globalAlpha = 1;
    // Arcs across live plates.
    for (const z of zaps) {
      if (!zapOn(z, time) || !onScreenX(z.x0, z.x1, 4)) continue;
      ctx.strokeStyle = "rgba(170,225,255,0.85)"; ctx.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        let x = z.x0;
        ctx.moveTo(sx(x), sy(z.y - 0.05));
        while (x < z.x1) { x += 0.2 + Math.random() * 0.2; ctx.lineTo(sx(Math.min(x, z.x1)), sy(z.y - 0.05 - Math.random() * 0.35)); }
        ctx.stroke();
      }
    }
    // Laser beams.
    for (const l of lasers) {
      if (!onScreenX(l.x - 1, l.x + 1, 4)) continue;
      const on = laserOn(l, time), warn = laserWarn(l, time);
      if (!on && !warn) continue;
      const X = sx(l.x), y0 = sy(l.y0) + 0.12 * PX, y1 = sy(l.y1) - 0.12 * PX;
      const a = on ? 1 : 0.25 + 0.25 * Math.sin(time * 40);
      ctx.strokeStyle = `rgba(255,40,70,${0.28 * a})`; ctx.lineWidth = Math.max(4, 0.16 * PX);
      ctx.beginPath(); ctx.moveTo(X, y0); ctx.lineTo(X, y1); ctx.stroke();
      ctx.strokeStyle = `rgba(255,190,200,${0.95 * a})`; ctx.lineWidth = Math.max(1, 0.035 * PX);
      ctx.beginPath(); ctx.moveTo(X, y0); ctx.lineTo(X, y1); ctx.stroke();
    }
    // Fitting beam from the capsule.
    if (fitT >= 0 && dock) {
      const p = fitT / FIT_DUR, a = Math.sin(Math.min(1, p) * Math.PI);
      const X = sx(dock.x), top = sy(dock.y - 1.3), bot = sy(ball.y);
      const cg = ctx.createLinearGradient(0, top, 0, bot);
      cg.addColorStop(0, `rgba(80,230,255,${0.35 * a})`); cg.addColorStop(1, `rgba(80,230,255,${0.1 * a})`);
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.moveTo(X - 0.15 * PX, top); ctx.lineTo(X + 0.15 * PX, top); ctx.lineTo(X + 0.45 * PX, bot); ctx.lineTo(X - 0.45 * PX, bot); ctx.closePath(); ctx.fill();
      if (Math.random() < 0.3) sparks(ball.x + (Math.random() - 0.5) * 0.5, ball.y, 1, "cyan");
    }
    // Thruster puff: a ring blown out under the ball.
    if (boostFx) {
      const k = boostFx.t / 0.4, X = sx(boostFx.x), Y = sy(boostFx.y + R * 0.9);
      ctx.strokeStyle = `rgba(110,240,255,${(0.8 * (1 - k)).toFixed(3)})`; ctx.lineWidth = Math.max(1.5, 0.06 * PX * (1 - k));
      ctx.beginPath(); ctx.ellipse(X, Y + k * 0.3 * PX, (0.25 + k * 0.9) * PX, (0.07 + k * 0.2) * PX, 0, 0, 6.283); ctx.stroke();
    }
    drawParticles(ctx, true);
    ctx.restore();
  }

  // Self-lit things drawn over the darkness: molten metal.
  function drawHot(t) {
    for (const m of melts) {
      if (!onScreenX(m.x0, m.x1, 4)) continue;
      const top = sy(m.y), bot = sy(m.y + (m.d || 2.2)), x0 = sx(m.x0), w = (m.x1 - m.x0) * PX;
      const gr = ctx.createLinearGradient(0, top, 0, bot);
      gr.addColorStop(0, "#ffd27a"); gr.addColorStop(0.08, "#ff8a2a"); gr.addColorStop(0.45, "#b8321a"); gr.addColorStop(1, "#3a0c05");
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(x0, bot);

  // Steam plumes: soft, so they go into the half-res light layer (added, which on the dark hall looks the same as a haze).
  function drawSteam(g, t) {
    const puff = radialSprite("puff", [[0, "rgb(235,220,205)"], [1, "rgba(235,220,205,0)"]]);
    for (const v of vents) {
      if (!onScreenX(v.x0 - 1, v.x1 + 1, 6)) continue;
      const on = ventOn(v, t), warn = ventWarn(v, t);
      if (!on && !warn) continue;
      const cx = (v.x0 + v.x1) / 2, half = (v.x1 - v.x0) / 2, N = on ? 24 : 5;

  })) : null;

      for (const m of melts) if (onScreenX(m.x0, m.x1) && Math.random() < dt * 1.8 * (m.x1 - m.x0)) {

      $("jumpIco").className = "jump-ico " + (hasJump ? (jumpCool > 0 ? "charge" : "ready") : "lock");
      const bIco = $("boostIco"), showB = hasDouble || (!!dock && dock.gives === "double");
      bIco.hidden = !showB;
      if (showB) bIco.className = "boost-ico " + (hasDouble ? (boosts > 0 ? "ready" : "used") : "lock");

      if (c) { pr.hidden = false; pr.textContent = "A · " + c.label; } else pr.hidden = true;
      for (const l of ledEls) l.classList.toggle("danger", started && ball.alive && !panel && dangerNow === 2);

  // ===================== Power and buttons =====================
  let powered = false, paused = false, panel = "off", orientBound = false;

  // Screen bloom: a small copy of the frame, squared so only bright areas survive,

  // Refreshes the small glow image (bl1); the soft-light pass adds it to the screen.
  function sampleBloom() {

  }

  window.addEventListener("resize", resize);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener("change", () => setTimeout(resize, 150));
  resize();
  requestAnimationFrame(frame);
})();

</script>
</body>
